<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Registration</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      :root {
        --bg-body: #0f172a;
        --bg-panel: #1e293b;
        --bg-card: #334155;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --accent-secondary: #10b981;
        --accent-warning: #f59e0b;
        --accent-primary: #3b82f6;
        --accent-alert: #ef4444;
        --radius-md: 12px;
        --radius-lg: 20px;
        --shadow: 0 4px 6 -1px rgba(0, 0, 0, 0.3);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      .hidden { display: none !important; }

      body {
        font-family: "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background-color: var(--bg-panel);
        padding: 1rem 2rem;
        border-bottom: 1px solid rgba(255,255,255, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .header-left { display: flex; align-items: center; gap: 1rem; }
      .header-right { display: flex; align-items: center; gap: 1rem; }

      .back-link {
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .back-link:hover { color: white; }

      .cat-toggle-container {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
        color: var(--text-muted);
        background: rgba(255,255,255,0.05);
        padding: 5px 10px;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.1);
      }
      .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
        background-color: #ccc; transition: .4s; border-radius: 20px;
      }
      .slider:before {
        position: absolute; content: ""; height: 14px; width: 14px;
        left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
      }
      input:checked + .slider { background-color: var(--accent-primary); }
      input:checked + .slider:before { transform: translateX(14px); }

      .auth-container {
        max-width: 400px;
        margin: 3rem auto;
        background: var(--bg-panel);
        padding: 2rem;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
      }
      .auth-title { text-align: center; margin-bottom: 1.5rem; color: var(--accent-primary); }
      .form-group { margin-bottom: 1rem; }
      .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; }
      .form-input {
        width: 100%; padding: 0.8rem;
        background: var(--bg-body); border: 1px solid rgba(255,255,255,0.2);
        border-radius: var(--radius-md); color: white;
      }
      .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 1.5rem; }
      .btn-full { width: 100%; justify-content: center; }

      main {
        flex: 1;
        padding: 2rem 1rem;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
      }
      h1 { margin-bottom: 1rem; font-size: 1.8rem; text-align: center; }

      .category-section {
        background-color: var(--bg-panel);
        border: 1px solid rgba(255,255,255, 0.1);
        border-radius: var(--radius-lg);
        margin-bottom: 1.5rem;
        overflow: hidden;
      }
      .category-header {
        background: var(--bg-card);
        padding: 1rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        user-select: none;
        transition: background 0.2s;
      }
      .category-header:hover { background: #3f4e68; }
      .category-title { font-weight: 700; font-size: 1.3rem; color: var(--text-main); display: flex; align-items: center; gap: 12px; }
      .category-icon { color: var(--accent-primary); width: 24px; text-align: center; }

      .split-content { display: none; border-top: 1px solid rgba(255,255,255, 0.1); }
      .split-content.open { display: block; }
      .split-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;
        padding: 1.5rem; background-color: var(--bg-body); min-height: 100px;
      }
      .col-header { 
        text-align: center; font-size: 0.9rem; font-weight: 700; 
        margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px; 
        color: var(--text-muted); padding-bottom: 0.5rem; 
        border-bottom: 1px solid rgba(255,255,255, 0.05); 
      }

      .person-card {
        background-color: var(--bg-card); border: 2px solid transparent;
        border-radius: var(--radius-md); padding: 1rem;
        transition: all 0.2s ease;
        position: relative; margin-bottom: 1rem;
        display: flex; flex-direction: column; gap: 0.5rem;
      }
      
      .col-left .person-card {
        cursor: pointer;
      }
      .col-left .person-card:hover {
        transform: translateY(-3px); border-color: var(--accent-primary);
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      }

      .col-right .person-card {
        border-color: rgba(16, 185, 129, 0.3);
        background-color: rgba(16, 185, 129, 0.05);
      }
      .col-right .person-card.expanded {
        border-color: var(--accent-primary);
        background-color: #2b3a50;
      }

      .card-header-row { display: flex; justify-content: space-between; align-items: flex-start; }
      .card-name { font-size: 1.1rem; font-weight: 700; padding-right: 35px; }

      .card-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .btn-edit-info {
        flex: 1;
        justify-content: center;
        background: rgba(255,255,255,0.1); 
        color: var(--text-main);
        border: 1px solid rgba(255,255,255,0.1);
      }
      .btn-edit-info:hover { background: rgba(255,255,255,0.2); }
      
      .btn-categories {
        flex: 1;
        justify-content: center;
        background: var(--accent-secondary); 
        color: white;
        border: 1px solid transparent;
      }
      .btn-categories:hover { background: #059669; }

      .card-categories { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; margin-top: 6px; }
      body.hide-categories .card-categories { display: none; }
      
      .cat-tag { 
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px; padding: 4px 8px; border-radius: 6px;
        background: rgba(255,255,255,0.05);
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
      
      .cat-tag-left { display: flex; align-items: center; gap: 6px; }
      .cat-spar { color: #a78bfa; }
      .cat-pat { color: #fcd34d; }
      .btn-remove-cat {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: var(--accent-alert);
        width: 22px; height: 22px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: 0.2s; font-size: 0.7rem;
        flex-shrink: 0;
      }
      .btn-remove-cat:hover { background: var(--accent-alert); color: white; }

      .card-details { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

      .extra-options-panel {
        display: none;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed rgba(255,255,255,0.2);
        flex-direction: column;
        gap: 8px;
        animation: slideDown 0.3s ease;
      }
      .person-card.expanded .extra-options-panel { display: flex; }

      @keyframes slideDown { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 500px; } }

      .extra-row {
        display: flex; align-items: center; justify-content: space-between;
        font-size: 0.85rem; background: rgba(0,0,0,0.2);
        padding: 8px 12px; border-radius: 8px;
        border: 1px solid transparent; transition: 0.2s;
      }
      .extra-row:hover { border-color: rgba(59, 130, 246, 0.3); }
      .extra-row.unavailable {
        opacity: 0.4;
        pointer-events: none;
        background: rgba(239, 68, 68, 0.08);
        border-color: rgba(239, 68, 68, 0.2);
      }
      .extra-label { flex: 1; color: var(--text-muted); }
      .extra-cat-name { color: var(--accent-primary); font-weight: 600; margin-left: 6px; }
      .extra-unavailable-note { color: var(--accent-alert); font-size: 0.75rem; font-style: italic; margin-left: 6px; }
      .extra-checkbox { width: 18px; height: 18px; accent-color: var(--accent-secondary); cursor: pointer; }

      .btn-save-panel {
        margin-top: 12px;
        width: 100%;
        background-color: var(--accent-primary);
        color: white;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        display: flex; align-items: center; justify-content: center; gap: 8px;
      }
      .btn-save-panel:hover { background-color: #2563eb; }
      .btn-save-panel:disabled { background-color: var(--text-muted); cursor: not-allowed; }

      .btn-unregister {
        position: absolute; top: 5px; right: 5px;
        background: rgba(239, 68, 68, 0.2); color: var(--accent-alert);
        border: 1px solid var(--accent-alert); width: 26px; height: 26px;
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: 0.2s; z-index: 10;
      }
      .btn-unregister:hover { background: var(--accent-alert); color: white; }

      .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.8); display: flex;
        justify-content: center; align-items: center; z-index: 2000;
        opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        backdrop-filter: blur(5px);
      }
      .modal-overlay.active { opacity: 1; pointer-events: all; }
      .modal-box {
        background: var(--bg-panel); width: 90%; max-width: 600px;
        border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        transform: scale(0.9); transition: transform 0.3s ease;
        display: flex; flex-direction: column; max-height: 90vh;
      }
      .modal-overlay.active .modal-box { transform: scale(1); }
      .modal-header { padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
      .modal-title { font-size: 1.5rem; font-weight: 700; color: var(--accent-primary); }
      .modal-close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
      .modal-close-btn:hover { color: white; }
      .modal-body { padding: 2rem; overflow-y: auto; }
      .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
      .full-width { grid-column: span 2; }
      .stat-label { display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.5rem; }
      .stat-value { font-size: 1.2rem; font-weight: 600; color: var(--text-main); padding: 0.5rem; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid transparent; }
      .stat-input { display: none; width: 100%; padding: 0.6rem; background: var(--bg-body); border: 1px solid var(--accent-primary); color: white; border-radius: 8px; font-size: 1.1rem; font-family: inherit; }
      .modal-box.editing .stat-value { display: none; }
      .modal-box.editing .stat-input { display: block; }
      .modal-footer { padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: flex-end; gap: 1rem; }
      .btn-modal { padding: 0.6rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
      .btn-cancel { background: rgba(255,255,255,0.1); color: var(--text-main); }
      .btn-cancel:hover { background: rgba(255,255,255,0.2); }
      .btn-edit { background: var(--accent-warning); color: #1a1a1a; }
      .btn-edit:hover { background: #d97706; }
      .btn-save { background: var(--accent-secondary); color: white; display: none; }
      .btn-save:hover { background: #059669; }
      .modal-box.editing .btn-edit { display: none; }
      .modal-box.editing .btn-save { display: inline-block; }

      .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
      .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top-color: var(--accent-secondary); border-radius: 50%; animation: spin 1s infinite linear; }
      @keyframes spin { 100% { transform: rotate(360deg); } }

      .btn { padding: 0.6rem 1.2rem; border: none; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
      .btn-primary { background-color: var(--accent-primary); color: white; }
      .btn-primary:hover { background-color: #2563eb; }
      .btn-secondary { background-color: rgba(255, 255, 255, 0.1); color: var(--text-main); }
      .btn-secondary:hover { background-color: rgba(255, 255, 255, 0.2); }

      .toast {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
        background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.2);
        padding: 12px 24px; border-radius: 10px; z-index: 3000;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4); transition: transform 0.4s ease;
        font-size: 0.9rem; display: flex; align-items: center; gap: 10px;
      }
      .toast.show { transform: translateX(-50%) translateY(0); }
      .toast.success { border-color: var(--accent-secondary); color: var(--accent-secondary); }
      .toast.error { border-color: var(--accent-alert); color: var(--accent-alert); }

      @media (max-width: 768px) {
        .split-grid { grid-template-columns: 1fr; gap: 0.5rem; }
        .category-header { flex-direction: column; align-items: flex-start; gap: 5px; }
        .stat-grid { grid-template-columns: 1fr; }
        .full-width { grid-column: span 1; }
        header { flex-direction: column; align-items: stretch; }
        .header-right { flex-direction: column; }
      }
    </style>
  </head>
  <body> 
    <header>
      <div class="header-left">
        <div class="logo" style="font-weight:bold; color:white; font-size:1.2rem;">Team Registration</div>
        <a href="index.html" class="back-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Back
        </a>
      </div>

      <div class="header-right">
        <div class="cat-toggle-container">
          <i class="fas fa-tags"></i> Categories
          <label class="switch">
            <input type="checkbox" id="catToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
                
        <a href="register.html" class="btn btn-primary" id="addTeamLink">
          <i class="fas fa-user-plus"></i> Add Person
        </a>
      </div>
    </header>

    <!-- AUTH SECTION -->
    <div id="authSection" class="auth-container">
      <h2 class="auth-title">Account Access</h2>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="Enter your email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-input" placeholder="Enter your password" />
      </div>
      <div class="btn-group">
        <button id="signinBtn" class="btn btn-primary btn-full">Sign In</button>
        <button id="signupBtn" class="btn btn-secondary btn-full">Sign Up</button>
        <button id="forgotBtn" class="btn btn-secondary btn-full" style="font-size:0.8rem; color:var(--text-muted)">Forgot Password?</button>
      </div>
      <div id="authMessage" style="margin-top:1rem; text-align:center; font-size:0.9rem;"></div>
    </div>

    <!-- MAIN CONTENT -->
    <main id="competitionSection" class="hidden">
      <h1>Select Participants</h1>

      <div class="category-section" id="sec-competitors">
        <div class="category-header" onclick="toggleSection('sec-competitors')">
          <div class="category-title">
            <span class="category-icon"><i class="fas fa-users"></i></span>
            Competitors
          </div>
          <div style="color: var(--text-muted);">
            <i class="fas fa-chevron-down" id="icon-sec-competitors"></i>
          </div>
        </div>
        <div class="split-content" id="content-sec-competitors">
          <div class="split-grid">
            <div class="col-left" id="comp-left">
              <div class="col-header">Available to Register</div>
            </div>
            <div class="col-right" id="comp-right">
              <div class="col-header" style="color: var(--accent-secondary)">Already Registered</div>
            </div>
          </div>
        </div>
      </div>

      <div class="category-section" id="sec-judges">
        <div class="category-header" onclick="toggleSection('sec-judges')">
          <div class="category-title">
            <span class="category-icon"><i class="fas fa-gavel"></i></span>
            Judges / Referees
          </div>
          <div style="color: var(--text-muted);">
            <i class="fas fa-chevron-down" id="icon-sec-judges"></i>
          </div>
        </div>
        <div class="split-content" id="content-sec-judges">
          <div class="split-grid">
            <div class="col-left" id="judge-left">
              <div class="col-header">Available to Register</div>
            </div>
            <div class="col-right" id="judge-right">
              <div class="col-header" style="color: var(--accent-secondary)">Already Registered</div>
            </div>
          </div>
        </div>
      </div>

      <div class="category-section" id="sec-coaches">
        <div class="category-header" onclick="toggleSection('sec-coaches')">
          <div class="category-title">
            <span class="category-icon"><i class="fas fa-chalkboard-teacher"></i></span>
            Coaches
          </div>
          <div style="color: var(--text-muted);">
            <i class="fas fa-chevron-down" id="icon-sec-coaches"></i>
          </div>
        </div>
        <div class="split-content" id="content-sec-coaches">
          <div class="split-grid">
            <div class="col-left" id="coach-left">
              <div class="col-header">Available to Register</div>
            </div>
            <div class="col-right" id="coach-right">
              <div class="col-header" style="color: var(--accent-secondary)">Already Registered</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
    </div>

    <!-- MODAL -->
    <div id="infoModal" class="modal-overlay">
      <div class="modal-box" id="infoModalBox">
        <div class="modal-header">
          <h3 class="modal-title" id="modalPersonTitle">Person Name</h3>
          <button class="modal-close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div id="modalStatsContainer" class="stat-grid"></div>
        </div>
        <div class="modal-footer">
          <button class="btn-modal btn-cancel" onclick="closeModal()">Close</button>
          <button class="btn-modal btn-edit" onclick="toggleEditMode()">Edit Info</button>
          <button class="btn-modal btn-save" onclick="savePersonChanges()">Save Changes</button>
        </div>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast"></div>

    <script>
      const SUPABASE_URL = "https://cziwnycosdxeuacslcza.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aXdueWNvc2R4ZXVhY3NsY3phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3MTkxMDAsImV4cCI6MjA4MjI5NTEwMH0.7OvfatHP7RAp6JS1F5hMlwfdSDgpN7EXsY2SVMoFSoY";

      const supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {

      const authSection = document.getElementById("authSection");
      const competitionSection = document.getElementById("competitionSection");
      const loadingOverlay = document.getElementById("loadingOverlay");
      
      let currentEditingPerson = null;
      let tournamentDate = new Date().toISOString().split('T')[0];
      let tempSelections = {}; 
      let currentCategoryCounts = {};

      // ============================================================
      // DYNAMIC CATEGORY CONFIG (loaded from admin's settings)
      // ============================================================
      let categoryConfig = {
        patterns: { ageGroups: [], kupRanges: {} },
        sparring: { ageGroups: [], weightBoundaries: {} }
      };

      const KUP_DAN_LEVELS = {
        "10th kup": 10, "10 kup": 10, "10kup": 10,
        "9th kup": 9, "9 kup": 9, "9kup": 9,
        "8th kup": 8, "8 kup": 8, "8kup": 8,
        "7th kup": 7, "7 kup": 7, "7kup": 7,
        "6th kup": 6, "6 kup": 6, "6kup": 6,
        "5th kup": 5, "5 kup": 5, "5kup": 5,
        "4th kup": 4, "4 kup": 4, "4kup": 4,
        "3rd kup": 3, "3 kup": 3, "3kup": 3,
        "2nd kup": 2, "2 kup": 2, "2kup": 2,
        "1st kup": 1, "1 kup": 1, "1kup": 1,
        "1st dan": 0, "1 dan": 0, "1dan": 0,
        "2nd dan": -1, "2 dan": -1, "2dan": -1,
        "3rd dan": -2, "3 dan": -2, "3dan": -2,
        "4th dan": -3, "4 dan": -3, "4dan": -3,
        "5th dan": -4, "5 dan": -4, "5dan": -4,
        "6th dan": -5, "6 dan": -5, "6dan": -5
      };

      function kupDanNameToNumber(name) {
        if (!name) return null;
        const normalized = name.toString().trim().toLowerCase();
        if (KUP_DAN_LEVELS[normalized] !== undefined) return KUP_DAN_LEVELS[normalized];
        const numMatch = normalized.match(/(\d+)/);
        if (numMatch) {
          const num = parseInt(numMatch[1]);
          if (normalized.includes('kup') && num >= 1 && num <= 10) return num;
          if (normalized.includes('dan') && num >= 1 && num <= 6) return -(num - 1);
        }
        return null;
      }

      async function loadCategoryConfig() {
        try {
          const { data: ageGroups, error: ageErr } = await supaClient
            .from("age_groups").select("*").order("order_priority", { ascending: true });

          if (ageErr || !ageGroups || ageGroups.length === 0) {
            console.warn("No age_groups found, using fallback");
            return;
          }

          const patternsGroups = ageGroups.filter(g => g.discipline === "patterns").sort((a,b) => a.order_priority - b.order_priority);
          const sparringGroups = ageGroups.filter(g => g.discipline === "sparring").sort((a,b) => a.order_priority - b.order_priority);

          categoryConfig.patterns.ageGroups = patternsGroups;
          categoryConfig.sparring.ageGroups = sparringGroups;

          const pIds = patternsGroups.map(g => g.id);
          if (pIds.length > 0) {
            const { data: pRanges } = await supaClient
              .from("patterns_kup_ranges").select("*").in("age_group_id", pIds).order("order_priority", { ascending: true });
            categoryConfig.patterns.kupRanges = {};
            if (pRanges) {
              pRanges.forEach(r => {
                if (!categoryConfig.patterns.kupRanges[r.age_group_id]) categoryConfig.patterns.kupRanges[r.age_group_id] = [];
                categoryConfig.patterns.kupRanges[r.age_group_id].push(r);
              });
            }
          }

          const sIds = sparringGroups.map(g => g.id);
          if (sIds.length > 0) {
            const { data: sBounds } = await supaClient
              .from("weight_boundaries").select("*").in("age_group_id", sIds).order("boundary_kg", { ascending: true });
            categoryConfig.sparring.weightBoundaries = {};
            if (sBounds) {
              sBounds.forEach(b => {
                if (!categoryConfig.sparring.weightBoundaries[b.age_group_id]) categoryConfig.sparring.weightBoundaries[b.age_group_id] = [];
                categoryConfig.sparring.weightBoundaries[b.age_group_id].push(b.boundary_kg);
              });
            }
          }
        } catch (err) {
          console.error("loadCategoryConfig error:", err);
        }
      }

      function getAgeGroupForAge(age, discipline) {
        const groups = (categoryConfig[discipline]?.ageGroups || []).filter(g => g.is_active !== false);
        for (const g of groups) {
          const min = Number(g.min_age);
          const max = g.max_age === null || g.max_age === undefined ? null : Number(g.max_age);
          if (age >= min && (max === null || age <= max)) return g;
        }
        return null;
      }

      function getNextAgeGroup(currentAgeGroup, discipline) {
        const groups = (categoryConfig[discipline]?.ageGroups || []).filter(g => g.is_active !== false);
        const idx = groups.findIndex(g => g.id === currentAgeGroup.id);
        if (idx !== -1 && idx < groups.length - 1) return groups[idx + 1];
        return null;
      }

      function getSparringWeightLabel(weightKg, ageGroupId) {
        const w = Number(weightKg);
        if (isNaN(w)) return null;
        const boundaries = (categoryConfig.sparring.weightBoundaries[ageGroupId] || []).slice().sort((a,b) => a-b);
        if (boundaries.length === 0) return null;
        if (w <= boundaries[0]) return "-" + boundaries[0] + "kg";
        for (let i = 0; i < boundaries.length - 1; i++) {
          if (w > boundaries[i] && w <= boundaries[i+1]) {
            return Math.ceil(boundaries[i]) + "-" + boundaries[i+1] + "kg";
          }
        }
        return "+" + boundaries[boundaries.length-1] + "kg";
      }

      function getNextWeightClass(currentWeightLabel, ageGroupId) {
        const boundaries = (categoryConfig.sparring.weightBoundaries[ageGroupId] || []).slice().sort((a,b) => a-b);
        if (boundaries.length === 0 || !currentWeightLabel) return null;

        let currentIdx = -1;
        if (currentWeightLabel.startsWith("-")) {
          currentIdx = 0;
        } else if (currentWeightLabel.startsWith("+")) {
          currentIdx = boundaries.length;
        } else {
          const match = currentWeightLabel.match(/^(\d+)-(\d+)kg$/);
          if (match) {
            const lower = parseInt(match[1]);
            for (let i = 0; i < boundaries.length - 1; i++) {
              if (boundaries[i] === lower || Math.ceil(boundaries[i]) === lower) {
                currentIdx = i + 1;
                break;
              }
            }
          }
        }

        if (currentIdx === -1 || currentIdx >= boundaries.length) return null;
        const nextIdx = currentIdx + 1;
        if (nextIdx > boundaries.length) return null;
        
        if (nextIdx === boundaries.length) {
          return "+" + boundaries[boundaries.length-1] + "kg";
        } else {
          return Math.ceil(boundaries[nextIdx-1]) + "-" + boundaries[nextIdx] + "kg";
        }
      }

      function getPatternsBeltLabel(kupDanNum, ageGroupId) {
        const ranges = (categoryConfig.patterns.kupRanges[ageGroupId] || []).filter(r => r.is_active !== false);
        if (ranges.length === 0) return null;
        for (const r of ranges) {
          const minK = Number(r.min_kup), maxK = Number(r.max_kup);
          const hi = Math.max(minK, maxK), lo = Math.min(minK, maxK);
          if (kupDanNum <= hi && kupDanNum >= lo) return r.display_name;
        }
        return null;
      }

      function calcAge(birth) {
        if (!birth) return 0;
        const b = new Date(birth);
        if (isNaN(b.getTime())) return 0;
        const today = tournamentDate ? new Date(tournamentDate) : new Date();
        let age = today.getFullYear() - b.getFullYear();
        if (today.getMonth() < b.getMonth() || (today.getMonth() === b.getMonth() && today.getDate() < b.getDate())) age--;
        return age;
      }

      // STRICTLY BOUNDARY-SYNCED CATEGORY COMPUTATION
      function computePersonCategories(personObj) {
        const age = calcAge(personObj.birthdate);
        const gChar = (personObj.gender || "").trim().toUpperCase().startsWith("M") ? "M" : "F";
        
        const result = {
          age,
          genderChar: gChar,
          sparring: { main: null, ageUp: null, weightUp: null, bothUp: null },
          patterns: { main: null, ageUp: null }
        };

        const isSparring = String(personObj.sparring).toLowerCase() === "yes" || personObj.sparring === true;
        const isPatterns = String(personObj.patterns).toLowerCase() === "yes" || personObj.patterns === true;
        const weightNum = Number(personObj.weight);

        // ============ SPARRING ============
        if (isSparring && weightNum > 0) {
          const ageGroup = getAgeGroupForAge(age, "sparring");
          if (ageGroup) {
            const weightLabel = getSparringWeightLabel(weightNum, ageGroup.id);
            if (weightLabel) {
              result.sparring.main = {
                ageGroup: ageGroup.display_name,
                ageGroupId: ageGroup.id,
                weightLabel: weightLabel,
                fullCat: ageGroup.display_name + " - " + weightLabel
              };

              // 1. Weight +1: Must be a valid NEXT weight class in the SAME age group
              const nextWeight = getNextWeightClass(weightLabel, ageGroup.id);
              if (nextWeight && nextWeight !== weightLabel) {
                result.sparring.weightUp = {
                  ageGroup: ageGroup.display_name,
                  ageGroupId: ageGroup.id,
                  weightLabel: nextWeight,
                  fullCat: ageGroup.display_name + " - " + nextWeight
                };
              }

              // 2. Age +1 and Both +1: Must have a valid NEXT age group WITH configured boundaries
              const nextAgeGroup = getNextAgeGroup(ageGroup, "sparring");
              if (nextAgeGroup) {
                // STRICT CHECK: Only proceed if the next age group actually has boundaries configured
                const nextBoundaries = categoryConfig.sparring.weightBoundaries[nextAgeGroup.id];
                if (nextBoundaries && nextBoundaries.length > 0) {
                  const weightInNextAge = getSparringWeightLabel(weightNum, nextAgeGroup.id);
                  
                  if (weightInNextAge) {
                    result.sparring.ageUp = {
                      ageGroup: nextAgeGroup.display_name,
                      ageGroupId: nextAgeGroup.id,
                      weightLabel: weightInNextAge,
                      fullCat: nextAgeGroup.display_name + " - " + weightInNextAge
                    };

                    const nextWeightInNextAge = getNextWeightClass(weightInNextAge, nextAgeGroup.id);
                    if (nextWeightInNextAge && nextWeightInNextAge !== weightInNextAge) {
                      result.sparring.bothUp = {
                        ageGroup: nextAgeGroup.display_name,
                        ageGroupId: nextAgeGroup.id,
                        weightLabel: nextWeightInNextAge,
                        fullCat: nextAgeGroup.display_name + " - " + nextWeightInNextAge
                      };
                    }
                  }
                }
              }
            }
          }
        }

        // ============ PATTERNS ============
        if (isPatterns) {
          const kupDanNum = kupDanNameToNumber(personObj.belt);
          if (kupDanNum !== null) {
            const ageGroup = getAgeGroupForAge(age, "patterns");
            if (ageGroup) {
              const beltLabel = getPatternsBeltLabel(kupDanNum, ageGroup.id);
              if (beltLabel) {
                result.patterns.main = {
                  ageGroup: ageGroup.display_name,
                  ageGroupId: ageGroup.id,
                  beltLabel: beltLabel,
                  fullCat: ageGroup.display_name + " - " + beltLabel
                };

                const nextAgeGroup = getNextAgeGroup(ageGroup, "patterns");
                if (nextAgeGroup) {
                  // STRICT CHECK: Only proceed if the next age group actually has ranges configured
                  const nextRanges = categoryConfig.patterns.kupRanges[nextAgeGroup.id];
                  if (nextRanges && nextRanges.length > 0) {
                    const beltInNextAge = getPatternsBeltLabel(kupDanNum, nextAgeGroup.id);
                    if (beltInNextAge) {
                      result.patterns.ageUp = {
                        ageGroup: nextAgeGroup.display_name,
                        ageGroupId: nextAgeGroup.id,
                        beltLabel: beltInNextAge,
                        fullCat: nextAgeGroup.display_name + " - " + beltInNextAge
                      };
                    }
                  }
                }
              }
            }
          }
        }

        return result;
      }

      async function loadAllData(userId) {
        loadingOverlay.style.display = "flex";
        tempSelections = {}; 

        await loadCategoryConfig();

        const { data: settings } = await supaClient.from("site_settings").select("tournament_date").eq("id",1).single();
        if (settings && settings.tournament_date) tournamentDate = settings.tournament_date;
        
        const [compRes, judgeRes, coachRes, countsRes, regRes] = await Promise.all([
          supaClient.from("competitors").select("*").eq("user_id", userId),
          supaClient.from("judges").select("*").eq("user_id", userId),
          supaClient.from("coaches").select("*").eq("user_id", userId),
          supaClient.from("category_counts").select("category_name, competitor_count"),
          supaClient.from("final_registrations").select("*").eq("user_id", userId)
        ]);

        currentCategoryCounts = {};
        if (countsRes.data) {
          countsRes.data.forEach(c => {
            currentCategoryCounts[c.category_name] = c.competitor_count;
          });
        }

        const regMap = new Map();
        if (regRes.data) regRes.data.forEach(r => regMap.set(String(r.entry_id), r));

        renderSplitSection("comp", "Competitors", "fa-users", compRes.data || [], regMap);
        renderSplitSection("judge", "Judges", "fa-gavel", judgeRes.data || [], regMap);
        renderSplitSection("coach", "Coaches", "fa-chalkboard-teacher", coachRes.data || [], regMap);
        
        toggleSection("sec-competitors");
        loadingOverlay.style.display = "none";
      }

      // ==========================================
      // REMOVE SINGLE CATEGORY
      // ==========================================
      async function removeSingleCategory(regId, entryToRemove) {
        if (!confirm(`Remove "${entryToRemove.full_cat}"?`)) return;
        
        const { data: { session } } = await supaClient.auth.getSession();
        const { data: regData } = await supaClient.from("final_registrations").select("*").eq("id", regId).eq("user_id", session.user.id).single();
        if (!regData) return;

        let currentList = regData.entry_data?.entries_list || [];
        currentList = currentList.filter(e => 
          !(e.discipline === entryToRemove.discipline && e.label === entryToRemove.label)
        );

        if (currentList.length === 0) {
          await supaClient.from("final_registrations").delete().eq("id", regId).eq("user_id", session.user.id);
        } else {
          await supaClient.from("final_registrations").update({
            entry_data: { entries_list: currentList }
          }).eq("id", regId).eq("user_id", session.user.id);
        }

        const { data: { session: newSession } } = await supaClient.auth.getSession();
        if (newSession) loadAllData(newSession.user.id);
      }

      // ==========================================
      // CREATE EXTRAS PANEL (Strictly Boundary-Synced)
      // ==========================================
      function createExtrasPanel(person, registration) {
        const panel = document.createElement("div");
        panel.className = "extra-options-panel";
        const regId = registration.id;

        const savedList = registration.entry_data?.entries_list || [];
        tempSelections[regId] = JSON.parse(JSON.stringify(savedList));
        
        const cats = computePersonCategories(person);

        const isEntrySelected = (disc, lbl) => tempSelections[regId].some(e => e.discipline === disc && e.label === lbl);

        const createRow = (displayLabel, saveLabel, catName, key, discipline, isChecked = false, isAvailable = true) => {
          const row = document.createElement("div");
          row.className = "extra-row" + (isAvailable ? "" : " unavailable");
          const count = currentCategoryCounts[catName] || 0;
          
          let rightSideHtml = '';
          if (isAvailable) {
            rightSideHtml = `<input type="checkbox" class="extra-checkbox" ${isChecked ? 'checked' : ''}>`;
          } else {
            rightSideHtml = `<span class="extra-unavailable-note"><i class="fas fa-ban"></i> Not available</span>`;
          }
          
          row.innerHTML = `
            <span class="extra-label">${displayLabel} <span class="extra-cat-name">${catName} <span style="opacity:0.7; font-size:0.8em;">(${count})</span></span></span>
            ${rightSideHtml}
          `;
          
          if (isAvailable) {
            const checkbox = row.querySelector('input');
            checkbox.addEventListener('change', (e) => {
              e.stopPropagation();
              const newChecked = checkbox.checked;
              
              if (newChecked && saveLabel !== "Main") {
                 const list = tempSelections[regId];
                 const hasMain = list.some(e => e.discipline === discipline && e.label === "Main");
                 if (!hasMain) {
                    checkbox.checked = false;
                    showToast("You must select the Main category first.", "error");
                    return; 
                 }
              }

              if (!newChecked && saveLabel === "Main") {
                 const list = tempSelections[regId];
                 const hasExtras = list.some(e => e.discipline === discipline && e.label !== "Main");
                 if (hasExtras) {
                    checkbox.checked = true;
                    showToast("Uncheck additional categories first.", "error");
                    return; 
                 }
              }

              toggleCategorySelection(regId, person, discipline, saveLabel, catName, newChecked);
            });
          }
          return row;
        };

        // ============ SPARRING OPTIONS ============
        if (cats.sparring.main) {
          panel.appendChild(createRow(
            "Sparring: Main", "Main", cats.sparring.main.fullCat, "spar_main", "sparring", isEntrySelected("sparring", "Main"), true
          ));

          if (cats.sparring.weightUp) {
            panel.appendChild(createRow(
              "Sparring: Weight +1", "Weight +1", cats.sparring.weightUp.fullCat, "spar_weight_up", "sparring", isEntrySelected("sparring", "Weight +1"), true
            ));
          }

          if (cats.sparring.ageUp) {
            panel.appendChild(createRow(
              "Sparring: Age +1", "Age +1", cats.sparring.ageUp.fullCat, "spar_age_up", "sparring", isEntrySelected("sparring", "Age +1"), true
            ));

            if (cats.sparring.bothUp) {
              panel.appendChild(createRow(
                "Sparring: Both +1", "Both +1", cats.sparring.bothUp.fullCat, "spar_both_up", "sparring", isEntrySelected("sparring", "Both +1"), true
              ));
            }
          }
        }

        // ============ PATTERNS OPTIONS ============
        if (cats.patterns.main) {
          panel.appendChild(createRow(
            "Patterns: Main", "Main", cats.patterns.main.fullCat, "pat_main", "patterns", isEntrySelected("patterns", "Main"), true
          ));

          if (cats.patterns.ageUp) {
            panel.appendChild(createRow(
              "Patterns: Age +1", "Age +1", cats.patterns.ageUp.fullCat, "pat_age_up", "patterns", isEntrySelected("patterns", "Age +1"), true
            ));
          }
        }

        if (!cats.sparring.main && !cats.patterns.main) {
          const note = document.createElement("div");
          note.style.cssText = "color:var(--text-muted); font-style:italic; font-size:0.85rem; padding:8px; text-align:center;";
          note.innerHTML = '<i class="fas fa-info-circle"></i> No additional categories available. Check age, weight, and belt configuration.';
          panel.appendChild(note);
        }

        const saveBtn = document.createElement("button");
        saveBtn.className = "btn-save-panel";
        saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Categories';
        
        saveBtn.addEventListener("click", async (e) => {
          e.stopPropagation();
          const btn = e.currentTarget;
          const originalText = btn.innerHTML;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
          btn.disabled = true;

          const uniqueList = [];
          const seen = new Set();
          for (const ent of tempSelections[regId]) {
             const sk = `${ent.discipline}-${ent.label}`;
             if (!seen.has(sk)) {
                seen.add(sk);
                uniqueList.push(ent);
             }
          }

          if (uniqueList.length === 0) {
             await supaClient.from("final_registrations").delete().eq("id", regId);
          } else {
             const { error } = await supaClient.from("final_registrations").update({
               entry_data: { entries_list: uniqueList }
             }).eq("id", regId);

             if (error) {
               showToast("Error saving: " + error.message, "error");
               btn.innerHTML = originalText;
               btn.disabled = false;
               return;
             }
          }
          
          showToast("Categories updated successfully!", "success");
          const { data: { session } } = await supaClient.auth.getSession();
          if(session) loadAllData(session.user.id);
        });

        panel.appendChild(saveBtn);
        return panel;
      }

      function toggleCategorySelection(regId, personObj, discipline, label, catName, isChecked) {
         let list = tempSelections[regId];
         list = list.filter(e => !(e.discipline === discipline && e.label === label));

         if (isChecked) {
           list.push({ discipline, label, full_cat: catName });
         }
         
         tempSelections[regId] = list;
         updateCategoryTagsDisplay(regId, list);
      }

      function updateCategoryTagsDisplay(regId, list) {
        const card = document.querySelector(`.person-card[data-reg-id="${regId}"]`);
        if (!card) return;
        const catDiv = card.querySelector(".card-categories");
        if (!catDiv) return;

        catDiv.innerHTML = "";

        list.forEach(entry => {
           const tagDiv = document.createElement("div");
           tagDiv.className = "cat-tag";
           
           const leftDiv = document.createElement("div");
           leftDiv.className = "cat-tag-left";
           
           const icon = entry.discipline === 'sparring' ? 'fa-fist-raised' : 'fa-chess-board';
           const colorClass = entry.discipline === 'sparring' ? 'cat-spar' : 'cat-pat';
           const count = currentCategoryCounts[entry.full_cat] || 0;
           
           leftDiv.innerHTML = `<i class="fas ${icon} ${colorClass}"></i> ${entry.full_cat} <span style="opacity:0.7; font-size:0.75rem;">(${count})</span>`;
           
           const removeBtn = document.createElement("button");
           removeBtn.className = "btn-remove-cat";
           removeBtn.innerHTML = '<i class="fas fa-times"></i>';
           removeBtn.addEventListener("click", async (e) => {
             e.stopPropagation();
             await removeSingleCategory(regId, entry);
           });
           
           tagDiv.appendChild(leftDiv);
           tagDiv.appendChild(removeBtn);
           catDiv.appendChild(tagDiv);
        });
      }

      async function handleRegistrationClick(card, person, type) {
        const { data: { session } } = await supaClient.auth.getSession();
        if(!session) return;

        const cats = computePersonCategories(person);
        const entriesList = [];
        
        if (type === 'comp') {
           if (cats.sparring.main) {
              entriesList.push({ discipline: "sparring", label: "Main", full_cat: cats.sparring.main.fullCat });
           }
           if (cats.patterns.main) {
              entriesList.push({ discipline: "patterns", label: "Main", full_cat: cats.patterns.main.fullCat });
           }
        }

        const payload = {
          user_id: session.user.id,
          entry_type: type,
          entry_id: String(person.id),
          entry_data: { entries_list: entriesList }
        };

        loadingOverlay.style.display = "flex";
        const { error } = await supaClient.from("final_registrations").insert([payload]);
        loadingOverlay.style.display = "none";

        if (error) showToast("Error registering: " + error.message, "error");
        else {
          showToast(`${person.name} registered!`, "success");
          loadAllData(session.user.id);
        }
      }

      function toggleSection(sectionId) {
        document.querySelectorAll(".split-content").forEach(el => el.classList.remove("open"));
        document.querySelectorAll(".category-header i.fa-chevron-up").forEach(el => {
            el.classList.remove("fa-chevron-up"); el.classList.add("fa-chevron-down");
        });
        const content = document.getElementById(`content-${sectionId}`);
        const icon = document.getElementById(`icon-${sectionId}`);
        if (!content.classList.contains("open")) {
          content.classList.add("open");
          icon.classList.remove("fa-chevron-down"); icon.classList.add("fa-chevron-up");
        }
      }

      document.getElementById('catToggle').addEventListener('change', (e) => {
        if(e.target.checked) document.body.classList.remove('hide-categories');
        else document.body.classList.add('hide-categories');
      });

      function openPersonModal(personData, type, personId) {
        currentEditingPerson = { id: personId, type: type, data: personData };
        const modal = document.getElementById("infoModal");
        const title = document.getElementById("modalPersonTitle");
        const container = document.getElementById("modalStatsContainer");
        const box = document.getElementById("infoModalBox");
        box.classList.remove("editing");
        container.innerHTML = "";
        title.textContent = personData.name;

        if (type === 'comp') {
          createStatField(container, "Name", "name", personData.name);
          createStatField(container, "Birth Date", "birthdate", personData.birthdate, "date");
          createStatField(container, "Gender", "gender", personData.gender, "select", ["Male", "Female"]);
          createStatField(container, "Belt", "belt", personData.belt, "belt-select");
          createStatField(container, "Weight (kg)", "weight", personData.weight, "number");
          createStatField(container, "Sparring", "sparring", personData.sparring, "select", ["Yes", "No"]);
          createStatField(container, "Patterns", "patterns", personData.patterns, "select", ["Yes", "No"]);
        } else {
          createStatField(container, "Name", "name", personData.name);
          createStatField(container, "Belt", "belt", personData.belt, "belt-select");
          createStatField(container, "Team", "team", personData.team);
        }
        modal.classList.add("active");
      }

      function closeModal() {
        document.getElementById("infoModal").classList.remove("active");
        currentEditingPerson = null;
      }

      function createStatField(container, label, key, value, inputType = "text", options = []) {
        const wrapper = document.createElement("div");
        if (label === "Weight (kg)" || label === "Name" || label === "Team") wrapper.className = "full-width";

        const labelEl = document.createElement("label");
        labelEl.className = "stat-label";
        labelEl.textContent = label;
        wrapper.appendChild(labelEl);
        
        const valEl = document.createElement("div");
        valEl.className = "stat-value";
        valEl.id = `val-${key}`;
        valEl.textContent = value || "-";
        wrapper.appendChild(valEl);
        
        const inpEl = document.createElement(inputType === "select" || inputType === "belt-select" ? "select" : "input");
        inpEl.className = "stat-input";
        inpEl.id = `inp-${key}`;
        inpEl.dataset.key = key;
        
        if (inputType === "number") inpEl.type = "number";
        if (inputType === "date") inpEl.type = "date";
        if (inputType === "select") {
          options.forEach(opt => {
            const o = document.createElement("option");
            o.value = opt; o.textContent = opt;
            if (opt === value) o.selected = true;
            inpEl.appendChild(o);
          });
        } else if (inputType === "belt-select") {
          const belts = ["10 kup","9 kup","8 kup","7 kup","6 kup","5 kup","4 kup","3 kup","2 kup","1 kup","1 dan","2 dan","3 dan","4 dan","5 dan","6 dan"];
          belts.forEach(b => {
            const o = document.createElement("option");
            o.value = b; o.textContent = b;
            if (b === value) o.selected = true;
            inpEl.appendChild(o);
          });
        } else {
          inpEl.value = value;
        }
        wrapper.appendChild(inpEl);
        container.appendChild(wrapper);
      }

      function toggleEditMode() {
        document.getElementById("infoModalBox").classList.add("editing");
      }

      async function savePersonChanges() {
        if (!currentEditingPerson) return;
        const inputs = document.querySelectorAll(".stat-input");
        const updateData = {};
        inputs.forEach(inp => { updateData[inp.dataset.key] = inp.value; });
        
        if (!updateData.name || !updateData.belt) { showToast("Name and Belt are required.", "error"); return; }
        if (currentEditingPerson.type === 'comp' && (!updateData.weight || updateData.weight <= 0)) { showToast("Weight is required.", "error"); return; }
        
        const btn = document.querySelector(".btn-save");
        const originalText = btn.textContent;
        btn.textContent = "Saving..."; btn.disabled = true;
        
        let tableName = currentEditingPerson.type === 'comp' ? "competitors" : currentEditingPerson.type === 'judge' ? "judges" : "coaches";
        
        const { error } = await supaClient.from(tableName).update(updateData).eq("id", currentEditingPerson.id);
        if (error) {
          showToast("Error saving: " + error.message, "error"); 
          btn.textContent = originalText; btn.disabled = false; 
          return;
        }

        if (currentEditingPerson.type === 'comp') {
           const newPersonData = { ...currentEditingPerson.data, ...updateData };
           const newCats = computePersonCategories(newPersonData);

           const { data: { session } } = await supaClient.auth.getSession();
           const { data: regData } = await supaClient.from("final_registrations").select("*").eq("entry_id", String(currentEditingPerson.id)).eq("user_id", session.user.id).single();

           if (regData) {
               let entriesList = regData.entry_data?.entries_list || [];

               const isSparringNo = String(updateData.sparring).toLowerCase() === "no";
               const isPatternsNo = String(updateData.patterns).toLowerCase() === "no";

               if (isSparringNo) entriesList = entriesList.filter(e => e.discipline !== "sparring");
               if (isPatternsNo) entriesList = entriesList.filter(e => e.discipline !== "patterns");

               const isSparringYes = String(newPersonData.sparring).toLowerCase() === "yes" || newPersonData.sparring === true;
               const isPatternsYes = String(newPersonData.patterns).toLowerCase() === "yes" || newPersonData.patterns === true;

               // Check if core attributes changed that affect category calculation
               const weightChanged = updateData.weight !== currentEditingPerson.data.weight;
               const birthdateChanged = updateData.birthdate !== currentEditingPerson.data.birthdate;
               const beltChanged = updateData.belt !== currentEditingPerson.data.belt;
               const coreChanged = weightChanged || birthdateChanged || beltChanged;

               if (coreChanged || isSparringYes || isPatternsYes) {
                  // Rebuild the list from scratch based on new categories, preserving "extra" selections if they are still valid
                  const oldExtras = entriesList.filter(e => e.label !== "Main");
                  entriesList = []; // Clear and rebuild

                  if (isSparringYes && newCats.sparring.main) {
                     entriesList.push({ discipline: "sparring", label: "Main", full_cat: newCats.sparring.main.fullCat });
                     
                     // Try to restore extras ONLY if they still exist in the newly computed valid categories
                     if (oldExtras.some(e => e.discipline === "sparring" && e.label === "Weight +1") && newCats.sparring.weightUp) {
                        entriesList.push(newCats.sparring.weightUp);
                     }
                     if (oldExtras.some(e => e.discipline === "sparring" && e.label === "Age +1") && newCats.sparring.ageUp) {
                        entriesList.push(newCats.sparring.ageUp);
                     }
                     if (oldExtras.some(e => e.discipline === "sparring" && e.label === "Both +1") && newCats.sparring.bothUp) {
                        entriesList.push(newCats.sparring.bothUp);
                     }
                  }

                  if (isPatternsYes && newCats.patterns.main) {
                     entriesList.push({ discipline: "patterns", label: "Main", full_cat: newCats.patterns.main.fullCat });
                     
                     if (oldExtras.some(e => e.discipline === "patterns" && e.label === "Age +1") && newCats.patterns.ageUp) {
                        entriesList.push(newCats.patterns.ageUp);
                     }
                  }
               }

               await supaClient.from("final_registrations").update({
                  entry_data: { entries_list: entriesList }
               }).eq("id", regData.id);
           }
        }

        btn.textContent = originalText; btn.disabled = false;
        closeModal();
        const { data: { session } } = await supaClient.auth.getSession();
        if(session) loadAllData(session.user.id);
      }

      document.addEventListener("DOMContentLoaded", checkSession);
    </script>
  </body>
</html>
