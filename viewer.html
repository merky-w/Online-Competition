<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tournament Live View</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root {
    --bg-body: #0f172a;
    --bg-panel: #1e293b;
    --bg-card: #334155;
    --bg-input: #0f172a;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --accent-primary: #3b82f6;
    --accent-secondary: #10b981;
    --accent-alert: #ef4444;
    --accent-warning: #f59e0b;
    --radius-md: 12px;
    --radius-lg: 20px;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.15);
    --transition: all 0.3s ease;
    --border: 1px solid rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-body);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background-color: var(--bg-panel);
    border-bottom: var(--border);
    padding: 1rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .nav-container {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .nav-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .live-indicator {
    display: flex; align-items: center; gap: 8px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: var(--accent-alert);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 700;
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent-alert);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }
  .btn-back {
    background-color: rgba(255, 255, 255, 0.1);
    color: var(--text-main);
    border: var(--border);
    padding: 0.5rem 1rem;
    border-radius: var(--radius-md);
    text-decoration: none;
    font-weight: 600;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-back:hover { background-color: rgba(255, 255, 255, 0.2); }

  main {
    flex: 1;
    padding: 2rem 1rem;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }

  .mode-selector {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .mode-btn {
    padding: 0.9rem 2rem;
    font-size: 1.05rem;
    font-weight: 700;
    border-radius: var(--radius-md);
    border: var(--border);
    background: var(--bg-panel);
    color: var(--text-muted);
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    max-width: 280px;
    justify-content: center;
  }
  .mode-btn:hover { background: var(--bg-card); color: var(--text-main); transform: translateY(-2px); }
  .mode-btn.active {
    background: linear-gradient(135deg, var(--accent-primary) 0%, #2563eb 100%);
    color: white;
    border-color: var(--accent-primary);
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
  }

  /* Filters */
  .filters-card {
    background: var(--bg-panel);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    border: var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 1.5rem;
  }
  .filters-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .filters-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filters-count {
    background: var(--accent-primary);
    color: white;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 700;
  }
  .filters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1rem;
    align-items: flex-end;
  }
  .filter-group { display: flex; flex-direction: column; gap: 0.4rem; }
  .filter-group label {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  select {
    width: 100%;
    padding: 0.75rem 0.9rem;
    background-color: var(--bg-input);
    border: var(--border);
    border-radius: var(--radius-md);
    color: var(--text-main);
    font-size: 0.95rem;
    outline: none;
    transition: var(--transition);
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    padding-right: 36px;
  }
  select:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
  select option { background: var(--bg-panel); color: var(--text-main); }
  .filter-clear-btn {
    background: rgba(239, 68, 68, 0.15);
    color: var(--accent-alert);
    border: 1px solid rgba(239, 68, 68, 0.4);
    padding: 0.75rem 1rem;
    border-radius: var(--radius-md);
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
    font-size: 0.9rem;
  }
  .filter-clear-btn:hover { background: var(--accent-alert); color: white; }

  /* Rings Grid */
  .rings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.2rem;
    margin-bottom: 2rem;
  }
  .ring-card {
    background: var(--bg-panel);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    border: 2px solid var(--border);
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .ring-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
    opacity: 0;
    transition: var(--transition);
  }
  .ring-card:hover { transform: translateY(-4px); border-color: var(--accent-primary); }
  .ring-card:hover::before { opacity: 1; }
  .ring-card.selected {
    border-color: var(--accent-secondary);
    background: rgba(16, 185, 129, 0.08);
  }
  .ring-card.selected::before { opacity: 1; }
  .ring-card.is-live {
    border-color: var(--accent-alert);
    animation: liveGlow 2s ease-in-out infinite;
  }
  @keyframes liveGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
    50% { box-shadow: 0 0 20px 4px rgba(239, 68, 68, 0.3); }
  }
  .ring-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1rem;
  }
  .ring-icon-wrap {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.05));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
    color: var(--accent-primary);
  }
  .ring-live-badge {
    background: var(--accent-alert);
    color: white;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.7rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 5px;
    letter-spacing: 0.5px;
  }
  .ring-live-badge .live-dot { width: 6px; height: 6px; }
  .ring-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 0.3rem; }
  .ring-current-fight {
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    padding: 10px;
    margin: 10px 0;
    border-left: 3px solid var(--accent-alert);
  }
  .ring-current-label {
    font-size: 0.65rem;
    color: var(--accent-alert);
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .ring-current-label .live-dot { width: 5px; height: 5px; }
  .ring-current-vs {
    font-size: 0.95rem;
    font-weight: 800;
    color: white;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ring-current-vs .vs-text { color: var(--accent-warning); font-size: 0.8rem; }
  .ring-current-vs .blue-name { color: #60a5fa; }
  .ring-current-vs .red-name { color: #f87171; }
  .ring-next-fight {
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 8px;
    border-left: 3px solid var(--accent-warning);
  }
  .ring-next-label {
    font-size: 0.6rem;
    color: var(--accent-warning);
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 3px;
  }
  .ring-next-vs {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ring-next-vs .vs-text { color: var(--text-muted); font-size: 0.75rem; }
  .ring-category {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ring-stats {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    margin-top: 0.8rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--border);
  }
  .ring-stat {
    font-size: 0.75rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .ring-stat strong { color: var(--text-main); }

  /* Ring Detail Panel */
  .ring-detail-panel {
    background: var(--bg-panel);
    border-radius: var(--radius-lg);
    border: var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 2rem;
    overflow: hidden;
  }
  .ring-detail-header {
    background: linear-gradient(135deg, var(--accent-primary), #2563eb);
    color: white;
    padding: 1.2rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .ring-detail-title {
    font-size: 1.4rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ring-detail-close {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    transition: var(--transition);
  }
  .ring-detail-close:hover { background: rgba(255,255,255,0.3); }
  .ring-detail-body { padding: 1.5rem; }

  /* Current Fight (Live) - BIG */
  .current-fight {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.12), rgba(239, 68, 68, 0.03));
    border: 2px solid var(--accent-alert);
    border-radius: var(--radius-md);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    position: relative;
  }
  .current-fight-label {
    position: absolute;
    top: -12px; left: 20px;
    background: var(--accent-alert);
    color: white;
    padding: 4px 14px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .current-fight-label .live-dot { width: 7px; height: 7px; }
  .current-fight-category {
    color: var(--accent-warning);
    font-size: 0.9rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    margin-top: 0.5rem;
  }
  .current-fight-vs {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 1rem;
    align-items: center;
  }
  .current-competitor {
    text-align: center;
    padding: 1rem;
    border-radius: var(--radius-md);
    background: rgba(0,0,0,0.3);
  }
  .current-competitor.blue { border: 2px solid #2563eb; background: rgba(37, 99, 235, 0.15); }
  .current-competitor.red { border: 2px solid #dc2626; background: rgba(220, 38, 38, 0.15); }
  .current-competitor-side {
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 0.4rem;
  }
  .current-competitor.blue .current-competitor-side { color: #60a5fa; }
  .current-competitor.red .current-competitor-side { color: #f87171; }
  .current-competitor-name {
    font-size: 1.2rem;
    font-weight: 800;
    color: white;
    margin-bottom: 0.3rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .current-competitor-club {
    font-size: 0.8rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .vs-divider {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--accent-warning);
  }

  /* Upcoming Fights Section */
  .upcoming-section-title {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--text-main);
    margin: 1.5rem 0 1rem 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--border);
  }
  .upcoming-section-title:first-child { margin-top: 0; }
  .upcoming-section-title .count-badge {
    background: var(--accent-warning);
    color: #1a1a1a;
    padding: 3px 12px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 800;
  }
  .upcoming-list { display: flex; flex-direction: column; gap: 0.6rem; }

  /* FIGHT CARD */
  .fight-card {
    background: var(--bg-card);
    border-radius: var(--radius-md);
    padding: 1rem 1.2rem;
    border-left: 5px solid var(--accent-primary);
    transition: var(--transition);
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 1rem;
    align-items: center;
  }
  .fight-card:hover { background: #3d4a5e; transform: translateX(4px); }
  .fight-card.is-next {
    border-left-color: var(--accent-warning);
    background: rgba(245, 158, 11, 0.08);
    box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.3);
  }
  .fight-card.new-category {
    border-left-color: var(--accent-secondary);
    background: rgba(16, 185, 129, 0.05);
  }
  .fight-order {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--accent-primary);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .fight-card.is-next .fight-order { background: var(--accent-warning); color: #1a1a1a; }
  .fight-card.new-category .fight-order { background: var(--accent-secondary); }

  .fight-info { min-width: 0; }
  .fight-category-tag {
    font-size: 0.7rem;
    color: var(--accent-warning);
    font-weight: 700;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fight-vs-display {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 1.1rem;
    font-weight: 800;
    line-height: 1.3;
  }
  .fight-vs-display .fighter-blue {
    color: #60a5fa;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }
  .fight-vs-display .fighter-red {
    color: #f87171;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }
  .fight-vs-display .vs-text {
    color: var(--accent-warning);
    font-size: 0.9rem;
    font-weight: 900;
  }
  .fight-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .fight-badge {
    padding: 5px 14px;
    border-radius: 10px;
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-next { background: rgba(245, 158, 11, 0.2); color: var(--accent-warning); }
  .badge-upcoming { background: rgba(59, 130, 246, 0.2); color: var(--accent-primary); }
  .badge-category { background: rgba(16, 185, 129, 0.2); color: var(--accent-secondary); }

  /* Bracket Cards */
  .bracket-card {
    background: var(--bg-panel);
    border-radius: var(--radius-lg);
    border: var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 1.5rem;
    overflow: hidden;
  }
  .bracket-card-header {
    background: linear-gradient(135deg, var(--bg-card), var(--bg-panel));
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
    border-bottom: var(--border);
  }
  .bracket-card-title {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .bracket-card-name {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text-main);
  }
  .bracket-disc-badge {
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .bracket-disc-badge.patterns { background: rgba(21, 101, 192, 0.2); color: #60a5fa; }
  .bracket-disc-badge.sparring { background: rgba(194, 24, 91, 0.2); color: #f472b6; }
  .bracket-count-badge {
    background: rgba(255,255,255,0.1);
    color: var(--text-muted);
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .bracket-winner-badge {
    background: rgba(16, 185, 129, 0.2);
    color: var(--accent-secondary);
    padding: 5px 12px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .bracket-card-body {
    padding: 1.5rem;
    overflow-x: auto;
  }
  .bracket-tree {
    display: flex;
    gap: 2.5rem;
    padding: 1rem 0;
    min-width: max-content;
    align-items: stretch;
  }
  .bracket-round {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    min-width: 220px;
    position: relative;
  }
  .round-title {
    text-align: center;
    font-size: 0.75rem;
    font-weight: 800;
    color: var(--text-muted);
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding-bottom: 0.5rem;
    border-bottom: 1px dashed var(--border);
  }
  .round-matches-wrap {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    flex: 1;
    gap: 0.6rem;
  }
  .match-box {
    background: var(--bg-card);
    border: var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 0.82rem;
    transition: var(--transition);
    position: relative;
  }
  .match-box:hover { border-color: var(--accent-primary); }
  .match-box.current-match {
    border-color: var(--accent-alert);
    box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.3);
    animation: currentPulse 2s ease-in-out infinite;
  }
  @keyframes currentPulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.3); }
    50% { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.5); }
  }
  .match-box.completed { opacity: 0.75; }
  .match-player {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 8px;
    border-radius: 4px;
    background: rgba(15, 23, 42, 0.5);
    gap: 6px;

<script>
/* ============================================================

============================================================ */
const SUPABASE_URL = "https://cziwnycosdxeuacslcza.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aXdueWNvc2R4ZXVhY3NsY3phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3MTkxMDAsImV4cCI6MjA4MjI5NTEwMH0.7OvfatHP7RAp6JS1F5hMlwfdSDgpN7EXsY2SVMoFSoY";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   STATE
============================================================ */
let activeMode = 'brackets';
let ringsData = [];
let ringAssignments = [];
let siteSettings = {};
let selectedRingId = null;
let ringsChannel = null;
let assignmentsChannel = null;
let extractedAgeGroups = [];
let allCompetitors = [];

/* ============================================================
   HELPERS
============================================================ */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function norm(s) { return String(s || '').trim().toLowerCase(); }

function extractAgeGroupFromCategory(catName) {
  if (!catName) return null;
  const parts = catName.split(' - ');
  if (parts.length >= 1) {
    const agePart = parts[0].trim();
    if (agePart) return agePart;
  }
  return null;
}

function isRealName(n) { return !!n && n !== "BYE" && n !== ""; }

function stageName(roundIdx, totalRounds) {
  const remaining = totalRounds - roundIdx;
  if (remaining === 1) return "Final";
  if (remaining === 2) return "Semi-Final";
  if (remaining === 3) return "Quarter-Final";
  if (remaining === 4) return "Round of 16";
  if (remaining === 5) return "Round of 32";
  return "Round " + (roundIdx + 1);
}

function globalFightNumber(bracket, roundIdx, matchIdx) {
  let n = 0;
  for (let r = 0; r < roundIdx; r++) n += bracket.rounds[r].length;
  return n + matchIdx + 1;
}

/* ============================================================
   BRACKET GENERATION (For on-the-fly viewing)
============================================================ */
async function fetchAllCompetitors() {
  try {
    const { data: allRegs, error: regErr } = await sb.from("final_registrations").select("*");
    if (regErr) throw regErr;
    const compRegs = (allRegs || []).filter(r => {
      const t = String(r.entry_type || r.type || r.role || "").toLowerCase();
      return t === "comp" || t === "competitor" || t === "c";
    });
    const compIds = [...new Set(compRegs.map(r => r.entry_id).filter(Boolean))];
    if (compIds.length === 0) return [];
    const { data: compDetails, error: compErr } = await sb.from("competitors").select("*").in("id", compIds);
    if (compErr) throw compErr;
    const out = [];
    (compDetails || []).forEach(person => {
      const personRegs = compRegs.filter(r => String(r.entry_id) === String(person.id));
      personRegs.forEach(reg => {
        let entries = [];
        if (reg.entry_data && Array.isArray(reg.entry_data.entries_list)) entries = reg.entry_data.entries_list;
        else if (Array.isArray(reg.entry_data)) entries = reg.entry_data;
        else if (Array.isArray(reg.entries_list)) entries = reg.entries_list;
        else if (reg.full_cat || reg.category || reg.discipline) entries = [{ full_cat: reg.full_cat || reg.category, discipline: reg.discipline }];
        entries.forEach(entry => {
          const fullCat = entry.full_cat || entry.category || entry.fullCat || "";
          const disc = String(entry.discipline || entry.type || "sparring").toLowerCase();
          out.push({ id: person.id, name: person.name || "Unknown", team: person.team || "N/A", gender: person.gender || "", belt: person.belt || "", _full_cat: fullCat, _discipline: disc });
        });
      });
    });
    return out;
  } catch (e) { console.error("fetchAllCompetitors error:", e); return []; }
}

function competitorsFor(categoryName, discipline, comps) {
  const target = norm(categoryName);
  const disc = norm(discipline);
  const seen = new Set();
  const list = [];
  comps.forEach(c => {
    if (norm(c._discipline) !== disc) return;
    if (norm(c._full_cat) !== target) return;
    const key = String(c.id) + "|" + norm(c.name);
    if (seen.has(key)) return;
    seen.add(key);
    list.push({ name: c.name, team: c.team, gender: c.gender, belt: c.belt });
  });
  return list;
}

function getBracketSize(count) { if (count <= 1) return 1; if (count === 2) return 2; if (count <= 4) return 4; if (count <= 8) return 8; if (count <= 16) return 16; if (count <= 32) return 32; return 64; }
function generateSeedOrder(size) { if (size === 1) return [0]; const half = size / 2; const left = generateSeedOrder(half); const right = left.map(x => x + half); const result = []; for (let i = 0; i < half; i++) { result.push(left[i]); result.push(right[i]); } return result; }
function spreadTeams(list, bracketSize) { const slots = new Array(bracketSize).fill(null); const teams = {}; list.forEach(p => { const key = p.team || "N/A"; if (!teams[key]) teams[key] = []; teams[key].push(p); }); const sortedTeams = Object.values(teams).sort((a, b) => b.length - a.length); const positions = generateSeedOrder(bracketSize); let posIndex = 0; sortedTeams.forEach(teamArr => { teamArr.forEach(player => { if (posIndex < positions.length) { slots[positions[posIndex]] = player; posIndex++; } }); }); return slots; }
function slotObj(p) { return p ? { name: p.name, team: p.team || "" } : { name: "BYE", team: "" }; }
function emptySlot() { return { name: "", team: "" }; }
function buildBracket(list, categoryName, discipline) {
  if (!list || list.length === 0) return null;
  const size = Math.max(2, getBracketSize(list.length));
  const totalRounds = Math.max(1, Math.log2(size));
  const seeded = spreadTeams(list, size);
  const slots = seeded.map(slotObj);
  const rounds = [];
  const r1 = [];
  for (let i = 0; i < size; i += 2) r1.push({ p1: slots[i], p2: slots[i + 1], winner: null, blue_score: 0, red_score: 0 });
  rounds.push(r1);
  let matchCount = size / 2;
  for (let r = 1; r < totalRounds; r++) {
    matchCount = matchCount / 2;
    const arr = [];
    for (let m = 0; m < matchCount; m++) arr.push({ p1: emptySlot(), p2: emptySlot(), winner: null, blue_score: 0, red_score: 0 });
    rounds.push(arr);
  }
  return { version: 1, category_name: categoryName, discipline: discipline, competitor_count: list.length, size: size, totalRounds: totalRounds, rounds: rounds, currentRound: 0, currentMatch: 0, champion: null, updated_at: new Date().toISOString() };
}
function autoResolveByes(bracket) {
  if (!bracket) return;
  let changed = true;
  let guard = 0;
  while (changed && guard < 12) {
    changed = false;
    guard++;
    for (let r = 0; r < bracket.rounds.length; r++) {
      for (let m = 0; m < bracket.rounds[r].length; m++) {
        const match = bracket.rounds[r][m];
        if (match.winner) continue;
        const n1 = match.p1.name;
        const n2 = match.p2.name;
        if (n1 === "" || n2 === "") continue;
        if (n1 === "BYE" && n2 === "BYE") { match.winner = "bye"; promote(bracket, r, m, { name: "BYE", team: "" }); changed = true; }
        else if (n1 === "BYE" && isRealName(n2)) { match.winner = "p2"; promote(bracket, r, m, match.p2); changed = true; }
        else if (n2 === "BYE" && isRealName(n1)) { match.winner = "p1"; promote(bracket, r, m, match.p1); changed = true; }
      }
    }
  }
}
function promote(bracket, roundIdx, matchIdx, winnerObj) {
  const nextRound = roundIdx + 1;
  if (nextRound >= bracket.rounds.length) { bracket.champion = winnerObj && isRealName(winnerObj.name) ? winnerObj : null; return; }
  const nextMatchIdx = Math.floor(matchIdx / 2);
  const slotKey = (matchIdx % 2 === 0) ? "p1" : "p2";
  const target = bracket.rounds[nextRound][nextMatchIdx];
  if (!target) return;
  target[slotKey] = { name: winnerObj.name, team: winnerObj.team || "" };
}

/* ============================================================
   DATA FETCHING
============================================================ */
async function loadData() {
  try {
    const [ringsRes, assignRes, settingsRes] = await Promise.all([
      sb.from("rings").select("*"),
      sb.from("ring_assignments").select("*").order("id", { ascending: true }),
      sb.from("site_settings").select("*").eq("id", 1).maybeSingle()
    ]);

    ringsData = ringsRes.data || [];
    ringAssignments = assignRes.data || [];
    siteSettings = settingsRes.data || {};

    const ageSet = new Set();
    ringAssignments.forEach(a => {
      const age = extractAgeGroupFromCategory(a.category_name);
      if (age) ageSet.add(age);
    });
    extractedAgeGroups = Array.from(ageSet).sort();
    populateAgeFilter();

    if (allCompetitors.length === 0) {
      allCompetitors = await fetchAllCompetitors();
    }

    document.getElementById('liveStatusText').textContent = 'LIVE';

    if (activeMode === 'brackets') renderBrackets();
    else renderRings();
  } catch (err) {
    console.error("Load error:", err);
    document.getElementById('liveStatusText').textContent = 'Error';
  }
}

function populateAgeFilter() {
  const sel = document.getElementById('filterAge');
  const current = sel.value;
  sel.innerHTML = '<option value="ALL">All Ages</option>';
  extractedAgeGroups.forEach(age => {
    const opt = document.createElement('option');
    opt.value = age;
    opt.textContent = age;
    sel.appendChild(opt);
  });
  if (extractedAgeGroups.includes(current)) sel.value = current;
}

function clearFilters() {
  document.getElementById('filterDiscipline').value = 'ALL';
  document.getElementById('filterGender').value = 'ALL';
  document.getElementById('filterAge').value = 'ALL';
  renderBrackets();
}

/* ============================================================
   REAL-TIME SUBSCRIPTIONS
============================================================ */
function subscribeRings() {
  if (ringsChannel) sb.removeChannel(ringsChannel);
  ringsChannel = sb.channel('view-rings-live')
    .on('postgres_changes', {
      event: 'UPDATE',
      schema: 'public',
      table: 'rings'
    }, payload => {
      if (!payload.new) return;
      const idx = ringsData.findIndex(r => r.id === payload.new.id);
      if (idx >= 0) ringsData[idx] = { ...ringsData[idx], ...payload.new };
      else ringsData.push(payload.new);
      
      if (activeMode === 'rings') {
        renderRings();
        if (selectedRingId) renderRingDetail(selectedRingId);
      }
    })
    .subscribe();
}

function subscribeAssignments() {
  if (assignmentsChannel) sb.removeChannel(assignmentsChannel);
  assignmentsChannel = sb.channel('view-assignments-live')
    .on('postgres_changes', {
      event: 'UPDATE',
      schema: 'public',
      table: 'ring_assignments'
    }, payload => {
      if (!payload.new) return;
      const idx = ringAssignments.findIndex(a => a.id === payload.new.id);
      if (idx >= 0) {
        ringAssignments[idx] = { ...ringAssignments[idx], ...payload.new };
      } else {
        ringAssignments.push(payload.new);
      }
      
      const ageSet = new Set();
      ringAssignments.forEach(a => {
        const age = extractAgeGroupFromCategory(a.category_name);
        if (age) ageSet.add(age);
      });
      extractedAgeGroups = Array.from(ageSet).sort();
      
      const currentAge = document.getElementById('filterAge').value;
      populateAgeFilter();
      document.getElementById('filterAge').value = currentAge;

      if (activeMode === 'brackets') renderBrackets();
      else {
        renderRings();
        if (selectedRingId) renderRingDetail(selectedRingId);
      }
    })
    .subscribe();
}

/* ============================================================
   VIEW SWITCHING
============================================================ */
function switchView(mode) {
  activeMode = mode;
  document.getElementById('btnModeBrackets').classList.toggle('active', mode === 'brackets');
  document.getElementById('btnModeRings').classList.toggle('active', mode === 'rings');
  document.getElementById('viewBrackets').classList.toggle('active', mode === 'brackets');
  document.getElementById('viewRings').classList.toggle('active', mode === 'rings');

  if (mode === 'brackets') renderBrackets();
  else renderRings();
}

/* ============================================================
   LIVE BRACKETS
============================================================ */
async function renderBrackets() {
  const disc = document.getElementById('filterDiscipline').value;
  const gen = document.getElementById('filterGender').value;
  const age = document.getElementById('filterAge').value;
  const container = document.getElementById('bracketsList');

  if (allCompetitors.length === 0) {
    allCompetitors = await fetchAllCompetitors();
  }

  const brackets = [];
  for (const a of ringAssignments) {
    let bs = a.bracket_state;
    const discipline = norm(a.discipline || 'sparring');
    const catName = a.category_name || '';
    const ageGroup = extractAgeGroupFromCategory(catName);
    
    if (!bs || !bs.rounds || !Array.isArray(bs.rounds)) {
      const list = competitorsFor(catName, discipline, allCompetitors);
      if (list.length > 0) {
        bs = buildBracket(list, catName, discipline);
        if (bs) autoResolveByes(bs);
      }
    }
    
    if (bs && bs.rounds && Array.isArray(bs.rounds)) {
      brackets.push({
        assignment: a,
        bracket: bs,
        discipline: discipline,
        categoryName: catName,
        ageGroup: ageGroup
      });
    }
  }

  const filtered = brackets.filter(b => {
    if (disc !== 'ALL' && b.discipline !== norm(disc)) return false;
    if (gen !== 'ALL') {
      const catLower = norm(b.categoryName);
      if (!catLower.includes(norm(gen))) return false;
    }
    if (age !== 'ALL') {
      if (!b.ageGroup || norm(b.ageGroup) !== norm(age)) return false;
    }
    return true;
  });

  document.getElementById('bracketCount').textContent =
    filtered.length + ' bracket' + (filtered.length !== 1 ? 's' : '');

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-sitemap"></i>
        <h3>No brackets found</h3>
        <p>Try adjusting your filters or start the tournament to generate brackets.</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(b => renderBracketCard(b)).join('');
}

function renderBracketCard(b) {
  const { bracket, categoryName, discipline } = b;
  const rounds = bracket.rounds || [];
  const champion = bracket.champion;
  const competitorCount = bracket.competitor_count || 0;
  const currentRound = bracket.currentRound;
  const currentMatch = bracket.currentMatch;

  let html = `
    <div class="bracket-card">
      <div class="bracket-card-header">
        <div class="bracket-card-title">
          <span class="bracket-card-name">${escapeHtml(categoryName)}</span>
          <span class="bracket-disc-badge ${discipline}">${discipline.toUpperCase()}</span>
          <span class="bracket-count-badge">
            <i class="fas fa-users"></i> ${competitorCount} competitors
          </span>
        </div>
        ${champion ? `
          <div class="bracket-winner-badge">
            <i class="fas fa-trophy"></i> ${escapeHtml(champion.name)}
          </div>` : ''}
      </div>
      <div class="bracket-card-body">
        <div class="bracket-tree">
  `;

  rounds.forEach((roundMatches, rIdx) => {
    const roundName = stageName(rIdx, rounds.length);
    html += `<div class="bracket-round">
      <div class="round-title">${escapeHtml(roundName)}</div>
      <div class="round-matches-wrap">`;

    roundMatches.forEach((match, mIdx) => {
      const isCurrent = (currentRound === rIdx && currentMatch === mIdx && !match.winner);
      const isCompleted = !!match.winner;
      const p1 = match.p1 || { name: '', team: '' };
      const p2 = match.p2 || { name: '', team: '' };
      const p1Name = p1.name || '';
      const p2Name = p2.name || '';

      let p1Winner = false, p2Winner = false;
      if (match.winner === 'p1') p1Winner = true;
      else if (match.winner === 'p2') p2Winner = true;

      html += `
        <div class="match-box ${isCurrent ? 'current-match' : ''} ${isCompleted ? 'completed' : ''}">
          <div class="match-player ${p1Winner ? 'winner' : ''} ${p1Name === 'BYE' || !p1Name ? 'bye' : ''}">
            <div class="match-player-info">
              <span class="match-player-name">${escapeHtml(p1Name || 'TBD')}</span>
              <span class="match-player-team">${escapeHtml(p1.team || '')}</span>
            </div>
            ${p1Winner && match.blue_score !== undefined ? `<span class="match-player-score">${match.blue_score}</span>` : ''}
          </div>
          <div class="match-player ${p2Winner ? 'winner' : ''} ${p2Name === 'BYE' || !p2Name ? 'bye' : ''}">
            <div class="match-player-info">
              <span class="match-player-name">${escapeHtml(p2Name || 'TBD')}</span>
              <span class="match-player-team">${escapeHtml(p2.team || '')}</span>
            </div>
            ${p2Winner && match.red_score !== undefined ? `<span class="match-player-score">${match.red_score}</span>` : ''}
          </div>
        </div>
      `;
    });

    html += `</div></div>`;
  });

  html += `</div></div></div>`;
  return html;
}

/* ============================================================
   RINGS VIEW
============================================================ */
function renderRings() {
  const grid = document.getElementById('ringsGrid');
  const totalRings = parseInt(siteSettings.rings_number) || ringsData.length || 4;

  if (totalRings === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column: 1/-1;">
        <i class="fas fa-ring"></i>
        <h3>No rings configured</h3>
        <p>Rings will appear here once configured by the admin.</p>
      </div>`;
    return;
  }

  let html = '';
  for (let i = 1; i <= totalRings; i++) {
    const ring = ringsData.find(r =>
      r.ring_number === i || r.id === i || String(r.id) === String(i)
    ) || ringsData[i - 1];

    const ringId = ring ? ring.id : i;
    const ringName = ring ? (ring.ring_name || `Ring ${i}`) : `Ring ${i}`;
    const isLive = ring && ring.blue_name && ring.red_name;
    const currentCategory = ring ? (ring.category_name || '') : '';
    const matchStage = ring ? (ring.match_stage || '') : '';

    const ringCats = ringAssignments.filter(a =>
      a.ring_number === i || String(a.ring_number) === String(i)
    );

    const currentAssignment = ring && ring.category_name
      ? ringCats.find(a =>
          a.category_name === ring.category_name &&
          norm(a.discipline) === norm(ring.discipline)
        ) || ringCats[0]
      : ringCats[0];

    let nextFightPreview = null;
    if (currentAssignment && currentAssignment.bracket_state) {
      const upcoming = getUpcomingMatchesFromBracket(currentAssignment.bracket_state, 1);
      if (upcoming.length > 0) nextFightPreview = upcoming[0];
    }

    html += `
      <div class="ring-card ${selectedRingId === ringId ? 'selected' : ''} ${isLive ? 'is-live' : ''}"
           onclick="selectRing(${ringId})">
        <div class="ring-header">
          <div class="ring-icon-wrap">
            <i class="fas fa-ring"></i>
          </div>
          ${isLive ? `
            <div class="ring-live-badge">
              <span class="live-dot"></span> LIVE
            </div>` : ''}
        </div>
        <div class="ring-title">${escapeHtml(ringName)}</div>

        ${isLive ? `
          <div class="ring-current-fight">
            <div class="ring-current-label">
              <span class="live-dot"></span> NOW FIGHTING
            </div>
            <div class="ring-current-vs">
              <span class="blue-name">${escapeHtml(ring.blue_name)}</span>
              <span class="vs-text">vs</span>
              <span class="red-name">${escapeHtml(ring.red_name)}</span>
            </div>
          </div>
        ` : ''}

        ${nextFightPreview ? `
          <div class="ring-next-fight">
            <div class="ring-next-label">⏭ NEXT UP</div>
            <div class="ring-next-vs">
              <span style="color:#60a5fa;">${escapeHtml(nextFightPreview.p1)}</span>
              <span class="vs-text">vs</span>
              <span style="color:#f87171;">${escapeHtml(nextFightPreview.p2)}</span>
            </div>
          </div>
        ` : ''}

        <div class="ring-category">
          <i class="fas fa-tag"></i> ${currentCategory ? escapeHtml(currentCategory) : (ringCats.length > 0 ? escapeHtml(ringCats[0].category_name) : 'No category yet')}
          ${matchStage ? ` · ${escapeHtml(matchStage)}` : ''}
        </div>

        <div class="ring-stats">
          <div class="ring-stat"><i class="fas fa-list"></i> <strong>${ringCats.length}</strong> categories</div>
        </div>
      </div>
    `;
  }
  grid.innerHTML = html;

  if (selectedRingId) renderRingDetail(selectedRingId);
}

function selectRing(ringId) {
  selectedRingId = ringId;
  renderRings();
  renderRingDetail(ringId);
  document.getElementById('ringDetailPanel').style.display = 'block';
  document.getElementById('ringDetailPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeRingDetail() {
  selectedRingId = null;
  document.getElementById('ringDetailPanel').style.display = 'none';
  renderRings();
}

/* ============================================================
   RING DETAIL - Shows LIVE fight + Next 5 Fights
============================================================ */
function renderRingDetail(ringId) {
  const ring = ringsData.find(r => r.id === ringId) || ringsData.find(r => String(r.id) === String(ringId));
  const body = document.getElementById('ringDetailBody');
  const titleEl = document.getElementById('ringDetailTitle');

  const ringNum = ring ? (ring.ring_number || ringId) : ringId;
  titleEl.textContent = ring ? (ring.ring_name || `Ring ${ringNum}`) : `Ring ${ringNum}`;

  const ringCats = ringAssignments.filter(a =>
    a.ring_number === ringNum || String(a.ring_number) === String(ringNum)
  );

  let html = '';

  // 1. Show current LIVE fight
  if (ring && ring.blue_name && ring.red_name) {
    html += `
      <div class="current-fight">
        <div class="current-fight-label">
          <span class="live-dot"></span> LIVE NOW
        </div>
        <div class="current-fight-category">
          <i class="fas fa-trophy"></i> ${escapeHtml(ring.category_name || 'Category')}
          ${ring.match_stage ? ` · ${escapeHtml(ring.match_stage)}` : ''}
          ${ring.match_number ? ` · Fight #${ring.match_number}` : ''}
        </div>
        <div class="current-fight-vs">
          <div class="current-competitor blue">
            <div class="current-competitor-side">🔵 BLUE</div>
            <div class="current-competitor-name">${escapeHtml(ring.blue_name)}</div>
            <div class="current-competitor-club">${escapeHtml(ring.blue_club || '')}</div>
          </div>
          <div class="vs-divider">VS</div>
          <div class="current-competitor red">
            <div class="current-competitor-side">🔴 RED</div>
            <div class="current-competitor-name">${escapeHtml(ring.red_name)}</div>
            <div class="current-competitor-club">${escapeHtml(ring.red_club || '')}</div>
          </div>
        </div>
      </div>
    `;
  }

  // 2. Collect NEXT 5 upcoming fights for this ring
  const allUpcoming = collectNext5FightsForRing(ring, ringCats, 5);

  if (allUpcoming.length > 0) {
    html += `<div class="upcoming-section-title">
      <i class="fas fa-forward"></i> Next ${allUpcoming.length} Fight${allUpcoming.length !== 1 ? 's' : ''}
      <span class="count-badge">${allUpcoming.length}</span>
    </div>`;
    html += `<div class="upcoming-list">`;

    allUpcoming.forEach((fight, idx) => {
      const isNext = idx === 0;
      const isNewCategory = fight._isNewCategory;
      const p1 = fight.p1 || 'TBD';
      const p2 = fight.p2 || 'TBD';
      const categoryName = fight._categoryName || '';
      const roundName = fight._roundName || '';
      const discipline = fight._discipline || '';

      let cardClass = 'fight-card';
      if (isNext) cardClass += ' is-next';
      else if (isNewCategory) cardClass += ' new-category';

      html += `
        <div class="${cardClass}">
          <div class="fight-order">${idx + 1}</div>
          <div class="fight-info">
            ${isNewCategory || isNext ? `<div class="fight-category-tag">
              <i class="fas fa-${discipline === 'patterns' ? 'chess-board' : 'fist-raised'}"></i>
              ${escapeHtml(categoryName)}
            </div>` : ''}
            <div class="fight-vs-display">
              <span class="fighter-blue">🔵 ${escapeHtml(p1)}</span>
              <span class="vs-text">vs</span>
              <span class="fighter-red">🔴 ${escapeHtml(p2)}</span>
            </div>
            <div class="fight-meta">
              ${roundName ? escapeHtml(roundName) : ''}
            </div>
          </div>
          <div class="fight-badge ${isNext ? 'badge-next' : (isNewCategory ? 'badge-category' : 'badge-upcoming')}">
            ${isNext ? '⏭ NEXT' : (isNewCategory ? 'NEW CAT' : 'UPCOMING')}
          </div>
        </div>
      `;
    });

    html += `</div>`;
  } else {
    html += `
      <div class="empty-state" style="margin-top:1rem;">
        <i class="fas fa-forward"></i>
        <h3>No upcoming fights</h3>
        <p>This ring has no more fights scheduled in the current or upcoming categories.</p>
      </div>
    `;
  }

  body.innerHTML = html;
}

/* ============================================================
   COLLECT NEXT 5 FIGHTS FOR A RING
   Pulls from current category first, then next categories on same ring
============================================================ */
function collectNext5FightsForRing(ring, ringCats, minCount) {
  const allFights = [];

  // Find current category being fought
  const currentAssignment = ring && ring.category_name
    ? ringCats.find(a =>
        a.category_name === ring.category_name &&
        norm(a.discipline) === norm(ring.discipline)
      ) || ringCats[0]
    : ringCats[0];

  // Get upcoming from current category
  if (currentAssignment) {
    let bs = currentAssignment.bracket_state;
    const catName = currentAssignment.category_name || '';
    const disc = norm(currentAssignment.discipline || 'sparring');

    // Generate on-the-fly if missing
    if (!bs || !bs.rounds || !Array.isArray(bs.rounds)) {
      const list = competitorsFor(catName, disc, allCompetitors);
      if (list && list.length > 0) {
        bs = buildBracket(list, catName, disc);
        if (bs) autoResolveByes(bs);
      }
    }

    if (bs && bs.rounds && Array.isArray(bs.rounds)) {
      const upcoming = getUpcomingMatchesFromBracket(bs, minCount);
      upcoming.forEach(m => {
        allFights.push({
          p1: m.p1,
          p2: m.p2,
          _categoryName: currentAssignment.category_name,
          _discipline: currentAssignment.discipline,
          _roundName: m.roundName,
          _isNewCategory: false
        });
      });
    }
  }

  // If we need more, pull from next categories on the same ring
  if (allFights.length < minCount) {
    const remainingCats = ringCats.filter(a => {
      if (currentAssignment && a.id === currentAssignment.id) return false;
      if (a.bracket_state && a.bracket_state.champion) return false;
      return true;
    });

    for (const cat of remainingCats) {
      if (allFights.length >= minCount) break;

      let bs = cat.bracket_state;
      const catName = cat.category_name || '';
      const disc = norm(cat.discipline || 'sparring');

      // Generate on-the-fly if missing
      if (!bs || !bs.rounds || !Array.isArray(bs.rounds)) {
        const list = competitorsFor(catName, disc, allCompetitors);
        if (list && list.length > 0) {
          bs = buildBracket(list, catName, disc);
          if (bs) autoResolveByes(bs);
        }
      }

      if (bs && bs.rounds && Array.isArray(bs.rounds)) {
        const needed = minCount - allFights.length;
        const catUpcoming = getUpcomingMatchesFromBracket(bs, needed);
        catUpcoming.forEach((m, idx) => {
          allFights.push({
            p1: m.p1,
            p2: m.p2,
            _categoryName: cat.category_name,
            _discipline: cat.discipline,
            _roundName: m.roundName,
            _isNewCategory: idx === 0
          });
        });
      }
    }
  }

  return allFights.slice(0, Math.max(minCount, allFights.length));
}

/* Get next N upcoming matches from a bracket_state */
function getUpcomingMatchesFromBracket(bracket, limit) {
  if (!bracket || !bracket.rounds) return [];
  const rounds = bracket.rounds;
  const totalRounds = rounds.length;
  const upcoming = [];

  const startR = bracket.currentRound !== null && bracket.currentRound !== undefined ? bracket.currentRound : 0;
  const startM = bracket.currentMatch !== null && bracket.currentMatch !== undefined ? bracket.currentMatch : 0;

  for (let r = startR; r < rounds.length && upcoming.length < limit; r++) {
    const startMatchIdx = (r === startR) ? startM : 0;
    for (let m = startMatchIdx; m < rounds[r].length && upcoming.length < limit; m++) {
      const match = rounds[r][m];
      if (match.winner) continue;
      const p1 = match.p1 && match.p1.name ? match.p1.name : '';
      const p2 = match.p2 && match.p2.name ? match.p2.name : '';
      if (!isRealName(p1) || !isRealName(p2)) continue;
      if (p1 === 'BYE' || p2 === 'BYE') continue;
      upcoming.push({
        p1: p1,
        p2: p2,
        roundName: stageName(r, totalRounds),
        matchNum: m + 1,
        discipline: bracket.discipline
      });
    }
  }
  return upcoming;
}

============================================================ */

  await loadData();
  subscribeRings();
  subscribeAssignments();
  setInterval(loadData, 20000);
});
