<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tournament Live View</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root {
    --bg-body: #0f172a;
    --bg-panel: #1e293b;
    --bg-card: #334155;
    --bg-input: #0f172a;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --accent-primary: #3b82f6;
    --accent-secondary: #10b981;
    --accent-alert: #ef4444;
    --accent-warning: #f59e0b;
    --accent-patterns: #1565c0;
    --accent-sparring: #c2185b;
    --radius-md: 12px;
    --radius-lg: 20px;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.15);
    --transition: all 0.3s ease;
    --border: 1px solid rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-body);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background-color: var(--bg-panel);
    border-bottom: var(--border);
    padding: 1rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .nav-container {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .nav-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .live-indicator {
    display: flex; align-items: center; gap: 8px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: var(--accent-alert);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 700;
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent-alert);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }
  .btn-back {
    background-color: rgba(255, 255, 255, 0.1);
    color: var(--text-main);
    border: var(--border);
    padding: 0.5rem 1rem;
    border-radius: var(--radius-md);
    text-decoration: none;
    font-weight: 600;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-back:hover { background-color: rgba(255, 255, 255, 0.2); }

  main {
    flex: 1;
    padding: 2rem 1rem;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }

  /* Mode Selector */
  .mode-selector {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .mode-btn {
    padding: 0.9rem 2rem;
    font-size: 1.05rem;
    font-weight: 700;
    border-radius: var(--radius-md);
    border: var(--border);
    background: var(--bg-panel);
    color: var(--text-muted);
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    max-width: 280px;
    justify-content: center;
  }
  .mode-btn:hover { background: var(--bg-card); color: var(--text-main); transform: translateY(-2px); }
  .mode-btn.active {
    background: linear-gradient(135deg, var(--accent-primary) 0%, #2563eb 100%);
    color: white;
    border-color: var(--accent-primary);
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
  }

  /* Filters */
  .filters-card {
    background: var(--bg-panel);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    border: var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 1.5rem;
  }
  .filters-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .filters-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filters-count {
    background: var(--accent-primary);
    color: white;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 700;
  }
  .filters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1rem;
    align-items: flex-end;
  }
  .filter-group { display: flex; flex-direction: column; gap: 0.4rem; }
  .filter-group label {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  select {
    width: 100%;
    padding: 0.75rem 0.9rem;
    background-color: var(--bg-input);
    border: var(--border);
    border-radius: var(--radius-md);
    color: var(--text-main);
    font-size: 0.95rem;
    outline: none;
    transition: var(--transition);
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    padding-right: 36px;
  }
  select:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
  select option { background: var(--bg-panel); color: var(--text-main); }
  .filter-clear-btn {
    background: rgba(239, 68, 68, 0.15);
    color: var(--accent-alert);
    border: 1px solid rgba(239, 68, 68, 0.4);
    padding: 0.75rem 1rem;
    border-radius: var(--radius-md);
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
    font-size: 0.9rem;
  }
  .filter-clear-btn:hover { background: var(--accent-alert); color: white; }

  /* Rings Grid */
  .rings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.2rem;
    margin-bottom: 2rem;
  }
  .ring-card {
    background: var(--bg-panel);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    border: 2px solid var(--border);
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .ring-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
    opacity: 0;
    transition: var(--transition);
  }
  .ring-card:hover { transform: translateY(-4px); border-color: var(--accent-primary); }
  .ring-card:hover::before { opacity: 1; }
  .ring-card.selected {
    border-color: var(--accent-secondary);
    background: rgba(16, 185, 129, 0.08);
  }
  .ring-card.selected::before { opacity: 1; }
  .ring-card.is-live {
    border-color: var(--accent-alert);
    animation: liveGlow 2s ease-in-out infinite;
  }
  @keyframes liveGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
    50% { box-shadow: 0 0 20px 4px rgba(239, 68, 68, 0.3); }
  }
  .ring-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1rem;
  }
  .ring-icon-wrap {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.05));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
    color: var(--accent-primary);
  }
  .ring-live-badge {
    background: var(--accent-alert);
    color: white;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.7rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 5px;
    letter-spacing: 0.5px;
  }
  .ring-live-badge .live-dot { width: 6px; height: 6px; }
  .ring-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 0.3rem; }
  .ring-category {
    font-size: 0.85rem;
    color: var(--accent-warning);
    font-weight: 600;
    margin-bottom: 0.5rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ring-stats {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    margin-top: 0.8rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--border);
  }
  .ring-stat {
    font-size: 0.75rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .ring-stat strong { color: var(--text-main); }

  /* Ring Detail Panel */
  .ring-detail-panel {
    background: var(--bg-panel);
    border-radius: var(--radius-lg);
    border: var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 2rem;
    overflow: hidden;
  }
  .ring-detail-header {
    background: linear-gradient(135deg, var(--accent-primary), #2563eb);
    color: white;
    padding: 1.2rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .ring-detail-title {
    font-size: 1.4rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ring-detail-close {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    transition: var(--transition);
  }
  .ring-detail-close:hover { background: rgba(255,255,255,0.3); }
  .ring-detail-body { padding: 1.5rem; }

  /* Current Fight (Live) */
  .current-fight {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.03));
    border: 2px solid var(--accent-alert);
    border-radius: var(--radius-md);
    padding: 1.2rem;
    margin-bottom: 1.5rem;
    position: relative;
  }
  .current-fight-label {
    position: absolute;
    top: -10px; left: 20px;
    background: var(--accent-alert);
    color: white;
    padding: 3px 12px;
    border-radius: 10px;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .current-fight-label .live-dot { width: 6px; height: 6px; }
  .current-fight-category {
    color: var(--accent-warning);
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    margin-top: 0.5rem;
  }
  .current-fight-stage {
    color: var(--text-muted);
    font-size: 0.8rem;
    margin-bottom: 1rem;
  }
  .current-fight-vs {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 1rem;
    align-items: center;
  }
  .current-competitor {
    text-align: center;
    padding: 1rem;
    border-radius: var(--radius-md);
    background: rgba(0,0,0,0.3);
  }
  .current-competitor.blue { border: 2px solid #2563eb; background: rgba(37, 99, 235, 0.1); }
  .current-competitor.red { border: 2px solid #dc2626; background: rgba(220, 38, 38, 0.1); }
  .current-competitor-side {
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 0.4rem;
  }
  .current-competitor.blue .current-competitor-side { color: #60a5fa; }
  .current-competitor.red .current-competitor-side { color: #f87171; }
  .current-competitor-name {
    font-size: 1.1rem;
    font-weight: 800;
    color: white;
    margin-bottom: 0.3rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .current-competitor-club {
    font-size: 0.8rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .vs-divider {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--accent-warning);
  }

  /* Upcoming Matches */
  .upcoming-section-title {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 1.5rem 0 0.8rem 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 0.5rem;
    border-bottom: 1px dashed var(--border);
  }
  .upcoming-section-title:first-child { margin-top: 0; }
  .upcoming-list { display: flex; flex-direction: column; gap: 0.7rem; }
  .upcoming-item {
    background: var(--bg-card);
    border-radius: var(--radius-md);
    padding: 1rem;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 1rem;
    align-items: center;
    border-left: 4px solid var(--accent-primary);
    transition: var(--transition);
  }
  .upcoming-item:hover { background: #3d4a5e; transform: translateX(4px); }
  .upcoming-item.next-match {
    border-left-color: var(--accent-warning);
    background: rgba(245, 158, 11, 0.08);
  }
  .upcoming-item.category-item { border-left-color: var(--accent-secondary); }
  .upcoming-order {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--accent-primary);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .upcoming-item.next-match .upcoming-order { background: var(--accent-warning); color: #1a1a1a; }
  .upcoming-item.category-item .upcoming-order { background: var(--accent-secondary); }
  .upcoming-info { min-width: 0; }
  .upcoming-category {
    font-size: 0.75rem;
    color: var(--accent-warning);
    font-weight: 700;
    margin-bottom: 0.2rem;
  }
  .upcoming-names {
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 0.95rem;
  }
  .upcoming-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 0.2rem;
  }
  .upcoming-badge {
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-live { background: rgba(239, 68, 68, 0.2); color: var(--accent-alert); }
  .badge-next { background: rgba(245, 158, 11, 0.2); color: var(--accent-warning); }
  .badge-upcoming { background: rgba(59, 130, 246, 0.2); color: var(--accent-primary); }
  .badge-category { background: rgba(16, 185, 129, 0.2); color: var(--accent-secondary); }

  /* Bracket Cards */
  .bracket-card {
    background: var(--bg-panel);
    border-radius: var(--radius-lg);
    border: var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 1.5rem;
    overflow: hidden;
  }
  .bracket-card-header {
    background: linear-gradient(135deg, var(--bg-card), var(--bg-panel));
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
    border-bottom: var(--border);
  }
  .bracket-card-title {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .bracket-card-name {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text-main);
  }
  .bracket-disc-badge {
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .bracket-disc-badge.patterns { background: rgba(21, 101, 192, 0.2); color: #60a5fa; }
  .bracket-disc-badge.sparring { background: rgba(194, 24, 91, 0.2); color: #f472b6; }
  .bracket-count-badge {
    background: rgba(255,255,255,0.1);
    color: var(--text-muted);
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .bracket-winner-badge {
    background: rgba(16, 185, 129, 0.2);
    color: var(--accent-secondary);
    padding: 5px 12px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .bracket-card-body {
    padding: 1.5rem;
    overflow-x: auto;
  }
  .bracket-tree {
    display: flex;
    gap: 2.5rem;
    padding: 1rem 0;
    min-width: max-content;
    align-items: stretch;
  }
  .bracket-round {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    min-width: 220px;
    position: relative;
  }
  .round-title {
    text-align: center;
    font-size: 0.75rem;
    font-weight: 800;
    color: var(--text-muted);
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding-bottom: 0.5rem;
    border-bottom: 1px dashed var(--border);
  }
  .round-matches-wrap {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    flex: 1;
    gap: 0.6rem;
  }
  .match-box {
    background: var(--bg-card);
    border: var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 0.82rem;
    transition: var(--transition);
    position: relative;
  }
  .match-box:hover { border-color: var(--accent-primary); }
  .match-box.current-match {
    border-color: var(--accent-alert);
    box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.3);
    animation: currentPulse 2s ease-in-out infinite;
  }
  @keyframes currentPulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.3); }
    50% { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.5); }
  }
  .match-box.completed { opacity: 0.75; }
  .match-player {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 8px;
    border-radius: 4px;
    background: rgba(15, 23, 42, 0.5);
    gap: 6px;
  }
  .match-player.winner {
    background: rgba(16, 185, 129, 0.2);
    border-left: 3px solid var(--accent-secondary);
    font-weight: 700;
  }
  .match-player.bye { opacity: 0.5; font-style: italic; }
  .match-player-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1;
  }
  .match-player-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 600;
    font-size: 0.82rem;
  }
  .match-player-team {
    font-size: 0.68rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .match-player-score {
    font-weight: 800;
    font-size: 0.9rem;
    color: var(--accent-warning);
    flex-shrink: 0;
  }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 3rem 2rem;
    background: var(--bg-panel);
    border-radius: var(--radius-lg);
    border: var(--border);
    color: var(--text-muted);
  }
  .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; display: block; }
  .empty-state h3 { color: var(--text-main); margin-bottom: 0.5rem; }

  .spinner {
    display: inline-block;
    width: 40px; height: 40px;
    border: 4px solid rgba(255,255,255,0.1);
    border-radius: 50%;
    border-top-color: var(--accent-primary);
    animation: spin 1s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-wrap { text-align: center; padding: 3rem; }

  .view-section { display: none; }
  .view-section.active { display: block; }

  .no-upcoming-msg {
    text-align: center;
    padding: 1.5rem;
    color: var(--text-muted);
    font-style: italic;
    background: rgba(0,0,0,0.2);
    border-radius: var(--radius-md);
    margin-top: 1rem;
  }

  @media (max-width: 768px) {
    .current-fight-vs { grid-template-columns: 1fr; gap: 0.5rem; }
    .vs-divider { text-align: center; }
    .bracket-tree { gap: 1.5rem; }
    .bracket-round { min-width: 180px; }
    .upcoming-item { grid-template-columns: auto 1fr; }
    .upcoming-badge { grid-column: 1 / -1; justify-self: start; }
    .filters-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="nav-container">
    <div class="nav-title">
      <i class="fas fa-eye"></i> Tournament Live View
    </div>
    <div class="nav-right">
      <div class="live-indicator">
        <span class="live-dot"></span>
        <span id="liveStatusText">Connecting...</span>
      </div>
      <a href="index.html" class="btn-back">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>
  </div>
</header>

<main>
  <div class="mode-selector">
    <button class="mode-btn active" id="btnModeBrackets" onclick="switchView('brackets')">
      <i class="fas fa-sitemap"></i> Live Brackets
    </button>
    <button class="mode-btn" id="btnModeRings" onclick="switchView('rings')">
      <i class="fas fa-ring"></i> Rings Overview
    </button>
  </div>

  <!-- LIVE BRACKETS VIEW -->
  <div id="viewBrackets" class="view-section active">
    <div class="filters-card">
      <div class="filters-header">
        <div class="filters-title">
          <i class="fas fa-filter"></i> Filter Brackets
        </div>
        <div class="filters-count" id="bracketCount">0 brackets</div>
      </div>
      <div class="filters-grid">
        <div class="filter-group">
          <label><i class="fas fa-list"></i> Discipline</label>
          <select id="filterDiscipline" onchange="renderBrackets()">
            <option value="ALL">All Disciplines</option>
            <option value="patterns">Patterns (Tul)</option>
            <option value="sparring">Sparring (Matsogi)</option>
          </select>
        </div>
        <div class="filter-group">
          <label><i class="fas fa-venus-mars"></i> Gender</label>
          <select id="filterGender" onchange="renderBrackets()">
            <option value="ALL">All Genders</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div class="filter-group">
          <label><i class="fas fa-child"></i> Age Group</label>
          <select id="filterAge" onchange="renderBrackets()">
            <option value="ALL">All Ages</option>
          </select>
        </div>
        <div class="filter-group">
          <label>&nbsp;</label>
          <button class="filter-clear-btn" onclick="clearFilters()">
            <i class="fas fa-times"></i> Clear
          </button>
        </div>
      </div>
    </div>

    <div id="bracketsList">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- RINGS VIEW -->
  <div id="viewRings" class="view-section">
    <div class="rings-grid" id="ringsGrid">
      <div class="loading-wrap" style="grid-column: 1/-1;"><div class="spinner"></div></div>
    </div>

    <div id="ringDetailPanel" class="ring-detail-panel" style="display: none;">
      <div class="ring-detail-header">
        <div class="ring-detail-title">
          <i class="fas fa-ring"></i>
          <span id="ringDetailTitle">Ring 1</span>
        </div>
        <button class="ring-detail-close" onclick="closeRingDetail()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="ring-detail-body" id="ringDetailBody"></div>
    </div>
  </div>
</main>

<script>
/* ============================================================
   CONFIG
============================================================ */
const SUPABASE_URL = "https://cziwnycosdxeuacslcza.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aXdueWNvc2R4ZXVhY3NsY3phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3MTkxMDAsImV4cCI6MjA4MjI5NTEwMH0.7OvfatHP7RAp6JS1F5hMlwfdSDgpN7EXsY2SVMoFSoY";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   STATE
============================================================ */
let activeMode = 'brackets';
let ringsData = [];
let ringAssignments = [];
let siteSettings = {};
let selectedRingId = null;
let ringsChannel = null;
let extractedAgeGroups = [];

/* ============================================================
   HELPERS
============================================================ */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function norm(s) { return String(s || '').trim().toLowerCase(); }

/* Extract age group name from category name like:
   "Juniors - 50-55kg (Male)" -> "Juniors"
   "Kids - 10th-9th Kup (Female)" -> "Kids"
*/
function extractAgeGroupFromCategory(catName) {
  if (!catName) return null;
  const parts = catName.split(' - ');
  if (parts.length >= 1) {
    const agePart = parts[0].trim();
    if (agePart) return agePart;
  }
  return null;
}

/* ============================================================
   DATA FETCHING
============================================================ */
async function loadData() {
  try {
    const [ringsRes, assignRes, settingsRes] = await Promise.all([
      sb.from("rings").select("*"),
      sb.from("ring_assignments").select("*"),
      sb.from("site_settings").select("*").eq("id", 1).maybeSingle()
    ]);

    ringsData = ringsRes.data || [];
    ringAssignments = assignRes.data || [];
    siteSettings = settingsRes.data || {};

    // Extract unique age groups from all bracket categories
    const ageSet = new Set();
    ringAssignments.forEach(a => {
      const age = extractAgeGroupFromCategory(a.category_name);
      if (age) ageSet.add(age);
    });
    extractedAgeGroups = Array.from(ageSet).sort();
    populateAgeFilter();

    document.getElementById('liveStatusText').textContent = 'LIVE';

    if (activeMode === 'brackets') renderBrackets();
    else renderRings();
  } catch (err) {
    console.error("Load error:", err);
    document.getElementById('liveStatusText').textContent = 'Error';
  }
}

function populateAgeFilter() {
  const sel = document.getElementById('filterAge');
  const current = sel.value;
  sel.innerHTML = '<option value="ALL">All Ages</option>';
  extractedAgeGroups.forEach(age => {
    const opt = document.createElement('option');
    opt.value = age;
    opt.textContent = age;
    sel.appendChild(opt);
  });
  if (extractedAgeGroups.includes(current)) sel.value = current;
}

function clearFilters() {
  document.getElementById('filterDiscipline').value = 'ALL';
  document.getElementById('filterGender').value = 'ALL';
  document.getElementById('filterAge').value = 'ALL';
  renderBrackets();
}

/* ============================================================
   REAL-TIME SUBSCRIPTION
============================================================ */
function subscribeRings() {
  if (ringsChannel) sb.removeChannel(ringsChannel);
  ringsChannel = sb.channel('view-rings-live')
    .on('postgres_changes', {
      event: 'UPDATE',
      schema: 'public',
      table: 'rings'
    }, payload => {
      if (!payload.new) return;
      const idx = ringsData.findIndex(r => r.id === payload.new.id);
      if (idx >= 0) ringsData[idx] = { ...ringsData[idx], ...payload.new };
      else ringsData.push(payload.new);
      if (activeMode === 'rings') {
        renderRings();
        if (selectedRingId) renderRingDetail(selectedRingId);
      }
    })
    .subscribe();
}

/* ============================================================
   VIEW SWITCHING
============================================================ */
function switchView(mode) {
  activeMode = mode;
  document.getElementById('btnModeBrackets').classList.toggle('active', mode === 'brackets');
  document.getElementById('btnModeRings').classList.toggle('active', mode === 'rings');
  document.getElementById('viewBrackets').classList.toggle('active', mode === 'brackets');
  document.getElementById('viewRings').classList.toggle('active', mode === 'rings');

  if (mode === 'brackets') renderBrackets();
  else renderRings();
}

/* ============================================================
   LIVE BRACKETS
============================================================ */
function renderBrackets() {
  const disc = document.getElementById('filterDiscipline').value;
  const gen = document.getElementById('filterGender').value;
  const age = document.getElementById('filterAge').value;
  const container = document.getElementById('bracketsList');

  const brackets = [];
  ringAssignments.forEach(a => {
    const bs = a.bracket_state;
    if (!bs || !bs.rounds || !Array.isArray(bs.rounds)) return;
    const discipline = norm(a.discipline || 'sparring');
    const catName = a.category_name || '';
    const ageGroup = extractAgeGroupFromCategory(catName);
    brackets.push({
      assignment: a,
      bracket: bs,
      discipline: discipline,
      categoryName: catName,
      ageGroup: ageGroup
    });
  });

  const filtered = brackets.filter(b => {
    if (disc !== 'ALL' && b.discipline !== norm(disc)) return false;
    if (gen !== 'ALL') {
      const catLower = norm(b.categoryName);
      if (!catLower.includes(norm(gen))) return false;
    }
    if (age !== 'ALL') {
      if (!b.ageGroup || norm(b.ageGroup) !== norm(age)) return false;
    }
    return true;
  });

  document.getElementById('bracketCount').textContent =
    filtered.length + ' bracket' + (filtered.length !== 1 ? 's' : '');

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-sitemap"></i>
        <h3>No brackets found</h3>
        <p>Try adjusting your filters or start the tournament to generate brackets.</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(b => renderBracketCard(b)).join('');
}

function renderBracketCard(b) {
  const { bracket, categoryName, discipline } = b;
  const rounds = bracket.rounds || [];
  const champion = bracket.champion;
  const competitorCount = bracket.competitor_count || 0;
  const currentRound = bracket.currentRound;
  const currentMatch = bracket.currentMatch;

  let html = `
    <div class="bracket-card">
      <div class="bracket-card-header">
        <div class="bracket-card-title">
          <span class="bracket-card-name">${escapeHtml(categoryName)}</span>
          <span class="bracket-disc-badge ${discipline}">${discipline.toUpperCase()}</span>
          <span class="bracket-count-badge">
            <i class="fas fa-users"></i> ${competitorCount} competitors
          </span>
        </div>
        ${champion ? `
          <div class="bracket-winner-badge">
            <i class="fas fa-trophy"></i> ${escapeHtml(champion.name)}
          </div>` : ''}
      </div>
      <div class="bracket-card-body">
        <div class="bracket-tree">
  `;

  rounds.forEach((roundMatches, rIdx) => {
    const roundName = getRoundName(rIdx, rounds.length);
    html += `<div class="bracket-round">
      <div class="round-title">${escapeHtml(roundName)}</div>
      <div class="round-matches-wrap">`;

    roundMatches.forEach((match, mIdx) => {
      const isCurrent = (currentRound === rIdx && currentMatch === mIdx && !match.winner);
      const isCompleted = !!match.winner;
      const p1 = match.p1 || { name: '', team: '' };
      const p2 = match.p2 || { name: '', team: '' };
      const p1Name = p1.name || '';
      const p2Name = p2.name || '';

      let p1Winner = false, p2Winner = false;
      if (match.winner === 'p1') p1Winner = true;
      else if (match.winner === 'p2') p2Winner = true;

      html += `
        <div class="match-box ${isCurrent ? 'current-match' : ''} ${isCompleted ? 'completed' : ''}">
          <div class="match-player ${p1Winner ? 'winner' : ''} ${p1Name === 'BYE' || !p1Name ? 'bye' : ''}">
            <div class="match-player-info">
              <span class="match-player-name">${escapeHtml(p1Name || 'TBD')}</span>
              <span class="match-player-team">${escapeHtml(p1.team || '')}</span>
            </div>
            ${p1Winner && match.blue_score !== undefined ? `<span class="match-player-score">${match.blue_score}</span>` : ''}
          </div>
          <div class="match-player ${p2Winner ? 'winner' : ''} ${p2Name === 'BYE' || !p2Name ? 'bye' : ''}">
            <div class="match-player-info">
              <span class="match-player-name">${escapeHtml(p2Name || 'TBD')}</span>
              <span class="match-player-team">${escapeHtml(p2.team || '')}</span>
            </div>
            ${p2Winner && match.red_score !== undefined ? `<span class="match-player-score">${match.red_score}</span>` : ''}
          </div>
        </div>
      `;
    });

    html += `</div></div>`;
  });

  html += `</div></div></div>`;
  return html;
}

function getRoundName(roundIdx, totalRounds) {
  const remaining = totalRounds - roundIdx;
  if (remaining === 1) return 'Final';
  if (remaining === 2) return 'Semi-Final';
  if (remaining === 3) return 'Quarter-Final';
  if (remaining === 4) return 'Round of 16';
  if (remaining === 5) return 'Round of 32';
  return 'Round ' + (roundIdx + 1);
}

/* ============================================================
   RINGS VIEW
============================================================ */
function renderRings() {
  const grid = document.getElementById('ringsGrid');
  const totalRings = parseInt(siteSettings.rings_number) || ringsData.length || 4;

  if (totalRings === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column: 1/-1;">
        <i class="fas fa-ring"></i>
        <h3>No rings configured</h3>
        <p>Rings will appear here once configured by the admin.</p>
      </div>`;
    return;
  }

  let html = '';
  for (let i = 1; i <= totalRings; i++) {
    const ring = ringsData.find(r =>
      r.ring_number === i || r.id === i || String(r.id) === String(i)
    ) || ringsData[i - 1];

    const ringId = ring ? ring.id : i;
    const ringName = ring ? (ring.ring_name || `Ring ${i}`) : `Ring ${i}`;
    const isLive = ring && ring.blue_name && ring.red_name;
    const currentCategory = ring ? (ring.category_name || '') : '';
    const matchStage = ring ? (ring.match_stage || '') : '';
    const matchNumber = ring ? (ring.match_number || 0) : 0;

    const ringCats = ringAssignments.filter(a =>
      a.ring_number === i || String(a.ring_number) === String(i)
    );

    html += `
      <div class="ring-card ${selectedRingId === ringId ? 'selected' : ''} ${isLive ? 'is-live' : ''}"
           onclick="selectRing(${ringId})">
        <div class="ring-header">
          <div class="ring-icon-wrap">
            <i class="fas fa-ring"></i>
          </div>
          ${isLive ? `
            <div class="ring-live-badge">
              <span class="live-dot"></span> LIVE
            </div>` : ''}
        </div>
        <div class="ring-title">${escapeHtml(ringName)}</div>
        <div class="ring-category">
          ${isLive ? escapeHtml(currentCategory) : (ringCats.length > 0 ? escapeHtml(ringCats[0].category_name) : 'No category yet')}
        </div>
        ${matchStage ? `<div style="font-size:0.8rem;color:var(--text-muted);">${escapeHtml(matchStage)} · Fight #${matchNumber || '-'}</div>` : ''}
        <div class="ring-stats">
          <div class="ring-stat"><i class="fas fa-list"></i> <strong>${ringCats.length}</strong> categories</div>
          ${ring && ring.next_blue_name ? `<div class="ring-stat"><i class="fas fa-forward"></i> Next: <strong>${escapeHtml(ring.next_blue_name)}</strong></div>` : ''}
        </div>
      </div>
    `;
  }
  grid.innerHTML = html;

  if (selectedRingId) renderRingDetail(selectedRingId);
}

function selectRing(ringId) {
  selectedRingId = ringId;
  renderRings();
  renderRingDetail(ringId);
  document.getElementById('ringDetailPanel').style.display = 'block';
  document.getElementById('ringDetailPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeRingDetail() {
  selectedRingId = null;
  document.getElementById('ringDetailPanel').style.display = 'none';
  renderRings();
}

/* ============================================================
   RING DETAIL - shows LIVE fight + 5+ upcoming fights
============================================================ */
function renderRingDetail(ringId) {
  const ring = ringsData.find(r => r.id === ringId) || ringsData.find(r => String(r.id) === String(ringId));
  const body = document.getElementById('ringDetailBody');
  const titleEl = document.getElementById('ringDetailTitle');

  const ringNum = ring ? (ring.ring_number || ringId) : ringId;
  titleEl.textContent = ring ? (ring.ring_name || `Ring ${ringNum}`) : `Ring ${ringNum}`;

  const ringCats = ringAssignments.filter(a =>
    a.ring_number === ringNum || String(a.ring_number) === String(ringNum)
  );

  let html = '';

  // Current LIVE fight
  if (ring && ring.blue_name && ring.red_name) {
    html += `
      <div class="current-fight">
        <div class="current-fight-label">
          <span class="live-dot"></span> LIVE NOW
        </div>
        <div class="current-fight-category">
          <i class="fas fa-trophy"></i> ${escapeHtml(ring.category_name || 'Category')}
          ${ring.match_stage ? ` · ${escapeHtml(ring.match_stage)}` : ''}
          ${ring.match_number ? ` · Fight #${ring.match_number}` : ''}
        </div>
        <div class="current-fight-vs">
          <div class="current-competitor blue">
            <div class="current-competitor-side">🔵 BLUE</div>
            <div class="current-competitor-name">${escapeHtml(ring.blue_name)}</div>
            <div class="current-competitor-club">${escapeHtml(ring.blue_club || '')}</div>
          </div>
          <div class="vs-divider">VS</div>
          <div class="current-competitor red">
            <div class="current-competitor-side">🔴 RED</div>
            <div class="current-competitor-name">${escapeHtml(ring.red_name)}</div>
            <div class="current-competitor-club">${escapeHtml(ring.red_club || '')}</div>
          </div>
        </div>
      </div>
    `;
  }

  // Find the current category being fought (if live)
  const currentAssignment = ring && ring.category_name
    ? ringCats.find(a =>
        a.category_name === ring.category_name &&
        norm(a.discipline) === norm(ring.discipline)
      ) || ringCats[0]
    : ringCats[0];

  // Collect upcoming fights from current category's bracket_state
  const upcomingFromCurrent = [];
  if (currentAssignment && currentAssignment.bracket_state) {
    const upcoming = getUpcomingMatchesFromBracket(
      currentAssignment.bracket_state,
      ring,
      6 // show at least 6 upcoming fights
    );
    upcoming.forEach(m => {
      m._fromCategory = currentAssignment.category_name;
      m._fromDiscipline = currentAssignment.discipline;
      upcomingFromCurrent.push(m);
    });
  }

  // Also add upcoming fights from remaining categories in this ring
  const remainingCats = ringCats.filter(a => {
    if (currentAssignment && a.id === currentAssignment.id) return false;
    if (a.bracket_state && a.bracket_state.champion) return false;
    return true;
  });

  // If we don't have 5 upcoming from current category, pull from next categories
  const remainingUpcoming = [];
  if (upcomingFromCurrent.length < 5 && remainingCats.length > 0) {
    const needed = 5 - upcomingFromCurrent.length;
    remainingCats.forEach(cat => {
      if (cat.bracket_state) {
        const catUpcoming = getUpcomingMatchesFromBracket(cat.bracket_state, null, 3);
        catUpcoming.forEach(m => {
          m._fromCategory = cat.category_name;
          m._fromDiscipline = cat.discipline;
          m._isCategoryStart = true;
          remainingUpcoming.push(m);
        });
      } else {
        // Category has no bracket yet, show as placeholder
        remainingUpcoming.push({
          p1: 'TBD',
          p2: 'TBD',
          roundName: 'Start',
          matchNum: 1,
          discipline: cat.discipline,
          _fromCategory: cat.category_name,
          _fromDiscipline: cat.discipline,
          _isCategoryStart: true,
          _isPlaceholder: true
        });
      }
    });
  }

  const allUpcoming = [...upcomingFromCurrent, ...remainingUpcoming].slice(0, 8);

  if (allUpcoming.length > 0) {
    html += `<div class="upcoming-section-title">
      <i class="fas fa-forward"></i> Upcoming Fights (${allUpcoming.length})
    </div>`;
    html += `<div class="upcoming-list">`;
    allUpcoming.forEach((m, idx) => {
      const isNext = idx === 0;
      const isNewCategory = m._isCategoryStart;
      const p1 = m.p1 || 'TBD';
      const p2 = m.p2 || 'TBD';
      const isPlaceholder = m._isPlaceholder;

      html += `
        <div class="upcoming-item ${isNext ? 'next-match' : ''} ${isNewCategory ? 'category-item' : ''}">
          <div class="upcoming-order">${idx + 1}</div>
          <div class="upcoming-info">
            ${isNewCategory ? `<div class="upcoming-category">
              <i class="fas fa-${m._fromDiscipline === 'patterns' ? 'chess-board' : 'fist-raised'}"></i>
              ${escapeHtml(m._fromCategory)}
            </div>` : ''}
            <div class="upcoming-names">
              🔵 ${escapeHtml(p1)} <span style="color:var(--text-muted);">vs</span>
              🔴 ${escapeHtml(p2)}
            </div>
            <div class="upcoming-meta">
              ${escapeHtml(m.roundName)} · Match #${m.matchNum}
              ${m.discipline ? ` · ${m.discipline.toUpperCase()}` : ''}
              ${isPlaceholder ? ' · <em style="color:var(--accent-warning)">Awaiting bracket</em>' : ''}
            </div>
          </div>
          <div class="upcoming-badge ${isNext ? 'badge-next' : (isNewCategory ? 'badge-category' : 'badge-upcoming')}">
            ${isNext ? 'NEXT' : (isNewCategory ? 'QUEUE' : 'UPCOMING')}
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }

  // Remaining categories that aren't started yet (if not already shown)
  const shownCatIds = new Set();
  if (currentAssignment) shownCatIds.add(currentAssignment.id);
  allUpcoming.forEach(m => {
    const found = ringCats.find(a => a.category_name === m._fromCategory);
    if (found) shownCatIds.add(found.id);
  });

  const notStartedCats = ringCats.filter(a => !shownCatIds.has(a.id));
  if (notStartedCats.length > 0) {
    html += `<div class="upcoming-section-title">
      <i class="fas fa-list-ol"></i> Later Categories (${notStartedCats.length})
    </div>`;
    html += `<div class="upcoming-list">`;
    notStartedCats.forEach((cat, idx) => {
      const compCount = cat.bracket_state ? (cat.bracket_state.competitor_count || 0) : 0;
      html += `
        <div class="upcoming-item category-item">
          <div class="upcoming-order">${idx + 1}</div>
          <div class="upcoming-info">
            <div class="upcoming-names">${escapeHtml(cat.category_name)}</div>
            <div class="upcoming-meta">
              ${escapeHtml((cat.discipline || 'sparring').toUpperCase())}
              ${compCount ? ` · ${compCount} competitors` : ''}
              ${cat.num_matches ? ` · ${cat.num_matches} fights` : ''}
            </div>
          </div>
          <div class="upcoming-badge badge-category">QUEUE</div>
        </div>
      `;
    });
    html += `</div>`;
  }

  if (!html) {
    html = `
      <div class="empty-state">
        <i class="fas fa-ring"></i>
        <h3>No matches scheduled</h3>
        <p>This ring has no active or upcoming matches.</p>
      </div>
    `;
  }

  body.innerHTML = html;
}

/* Get next N upcoming matches from a bracket_state */
function getUpcomingMatchesFromBracket(bracket, ring, limit) {
  if (!bracket || !bracket.rounds) return [];
  const rounds = bracket.rounds;
  const totalRounds = rounds.length;
  const upcoming = [];

  // Start from current position, look ahead
  const startR = bracket.currentRound || 0;
  const startM = bracket.currentMatch || 0;

  for (let r = startR; r < rounds.length && upcoming.length < limit; r++) {
    const startMatchIdx = (r === startR) ? startM : 0;
    for (let m = startMatchIdx; m < rounds[r].length && upcoming.length < limit; m++) {
      const match = rounds[r][m];
      if (match.winner) continue;
      const p1 = match.p1 && match.p1.name ? match.p1.name : 'TBD';
      const p2 = match.p2 && match.p2.name ? match.p2.name : 'TBD';
      if (p1 === 'BYE' || p2 === 'BYE') continue;
      upcoming.push({
        p1: p1,
        p2: p2,
        p1Team: match.p1 ? match.p1.team : '',
        p2Team: match.p2 ? match.p2.team : '',
        roundName: getRoundName(r, totalRounds),
        matchNum: m + 1,
        discipline: bracket.discipline
      });
    }
  }
  return upcoming;
}

/* ============================================================
   INIT
============================================================ */
document.addEventListener("DOMContentLoaded", async () => {
  await loadData();
  subscribeRings();
  // Refresh every 20 seconds as fallback
  setInterval(loadData, 20000);
});
</script>
